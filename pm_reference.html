<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SA 午後リファレンス</title><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:20px;line-height:1.65}.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select{font:inherit;padding:8px}.card{border:1px solid #aaa;border-radius:12px;padding:14px;margin:12px 0}.txt{white-space:pre-wrap;font-family:system-ui,sans-serif;font-size:.95em}.meta{opacity:.72}.links a{margin-right:12px}details{margin-top:8px}</style></head><body><h1>午後I・午後II リファレンスDB</h1><p>2023–2025の17問。IPAの解答例/出題趣旨と採点講評をテキスト検索できます。問題冊子そのものは原本PDFを開きます。</p><div class="ctl"><select id="year"><option value="">全年度</option><option>2023</option><option>2024</option><option>2025</option></select><select id="sec"><option value="">午後I・II</option><option>午後I</option><option>午後II</option></select><input id="kw" placeholder="本文・テーマを検索" size="28"><button onclick="render()">検索</button></div><div id="app"></div><script>const D={"entries": [{"year": 2023, "section": "午後I", "question_no": 1, "topic": "ERPパッケージのバージョンアップを伴う基幹システム再構築・移行計画", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問１\n                                       出題趣旨\n ERP パッケージ製品などのサポート期限を契機として情報システムの再構築を行うことが多い。このような\n再構築のプロジェクトにおいて，システムアーキテクトは情報システムの仕様を理解し，経営方針や業務要\n件，及び各種の制約条件に基づいた適切な移行計画を立案する必要がある。\n 本問では，ERP パッケージ製品のバージョンアップを伴う基幹システムの再構築プロジェクトを題材とし\nて，社内の上層部から提示された再構築や移行に関する指示と方針，社外を含めた業務要件，及び各種の制約\n条件に基づいた，適切な移行計画の立案を行う能力を問う。\n\n\n 設問                                 解答例・解答の要点                   備考\n 設問１        金曜日までに，月曜日が納品日の品物を発注すること\n 設問２        a 現行バージョンのデータ構造から新バージョンのデータ構造に変更\n設問３ (1) 経理担当者の事務処理の負担が大きいこと\n      (2) 関連会社の新基幹システムのデータはコード変換が行われるから\n      (3) 過去の経営状況を新たな切り口でも分析できるようにすること\n      (4) 範囲         前々月以前\n            理由       前々月以前の実績データは更新されないから", "commentary_text": "問１\n 問 1 では，ERP パッケージ製品のバージョンアップを伴う基幹システムの再構築プロジェクトを題材に，各\n種の要件や制約条件に基づいた移行計画の立案について出題した。全体として正答率は平均的であった。\n 設問 3(1)は，正答率がやや低かった。業務上の問題を問うたにもかかわらず， “各種のコードが A 社と関連\n会社の間で統一されていない”というシステム上の問題を誤って解答した受験者が多かった。業務上の問題と\nシステム上の問題とを正しく区別して解答することを心掛けてほしい。\n 設問 3(2)は，正答率が低かった。基幹システムのデータ移行方法に関する理由と混同して解答した受験者が\n多かった。複数のシステムを取り扱う移行計画の立案では，システムごとに異なる要件や制約条件を正しく理\n解することが求められる。システムごとのデータ移行方法の違いをよく理解して，正答を導き出してほしい。", "question_file": "sources/2023r05h_sa_pm1_qs.pdf", "answer_file": "sources/2023r05h_sa_pm1_ans.pdf", "commentary_file": "sources/2023r05h_sa_pm1_cmnt.pdf"}, {"year": 2023, "section": "午後I", "question_no": 2, "topic": "オンラインセミナー管理システムの新規開発・機能/ファイル設計", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問２\n                                       出題趣旨\n 情報システムの構築において，システムアーキテクトは，要件を正しく理解した上で設計を行う必要があ\nる。昨今，新生活様式の浸透に伴い，従来対面方式で行っていた業務をオンラインに変更することが多くなっ\nている。\n 本問では，オンラインセミナーを担うセミナー管理システムの新規開発を題材として，要件を正しく理解し\nた上で，機能やファイルの設計を行う能力，及びレビュー指摘事項や追加要望に応じた設計変更を行う能力を\n問う。\n\n\n 設問                               解答例・解答の要点                     備考\n設問１ (1) セミナーID，担当役割，担当者 ID\n      (2)   a   受講申込\n            b   メールアドレス\n 設問２        申込確認画面が表示されている間に他者の申込みが確定されて定員に達した場\n            合\n設問３ (1) チェック 当該受講 ID の受講ファイルの接続フラグが“0”のときはエラーと\n             しない。\n            更新処理 受講ファイルの接続フラグに“1”を設定して更新する。\n      (2)       属性    アンケート URL\n            ファイル 受講申込\n      (3)   c   セミナーファイルの定員\n            d   受講ファイルのレコード件数\n            e   受講申込ファイルのレコード件数\n            f   アンケートファイルの評価点の合計\n\n\n\n\n                                        1/2\n\n                                                ©2023   独立行政法人情報処理推進機構", "commentary_text": "問２\n 問 2 では，セミナー管理システムの新規開発を題材に，システムの機能やファイルの設計，及びレビュー指\n摘事項や追加要望に応じた設計変更について出題した。全体として正答率は平均的であった。\n 設問 2 の正答率は平均的であったが，先に他者が申込みを確定した場合とだけ解答し，その結果として定員\nに達することについては全く触れていない受験者が多かった。どのような場合に定員を超過することがあるの\nかを考えて，正答を導き出してほしい。\n 設問 3(2)は，正答率が低かった。移す先のファイル名を誤って解答した受験者が散見された。設計変更前の\nデータ設計を把握した上で，追加要望を満たすことができる適切な移動先のファイルを導き出してほしい。", "question_file": "sources/2023r05h_sa_pm1_qs.pdf", "answer_file": "sources/2023r05h_sa_pm1_ans.pdf", "commentary_file": "sources/2023r05h_sa_pm1_cmnt.pdf"}, {"year": 2023, "section": "午後I", "question_no": 3, "topic": "融資保証システム再構築・機能設計", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問３\n                                    出題趣旨\n 情報システムを再構築する際，システムアーキテクトは，業務の効率化や利便性を考慮し，新システムの要\n望をシステム要件として設計する必要がある。\n 本問では，融資保証システムの再構築を題材として，現行業務を正しく把握し，新システムへの要望から情\n報システムに求められている機能の設計について，具体的な記述を求めている。システム要件を正しく理解\nし，求められている情報システムを設計する能力を問う。\n\n\n 設問                              解答例・解答の要点                   備考\n 設問１            要望    (e)\n                理由    情報セキュリティ規則で外部信用機関との接続は外信端末に限定して\n                      いるから\n 設問２            a   送信元 FAX 番号\n                b   金融機関                                  a，b と c，d の\n                c   受信 FAX 番号                             組合せは順不同\n                d   申込種別\n 設問３            保証料管理，書類管理\n設問４ (1) 外部信用機関に保証完了の報告をするため\n          (2) 保証案件の契約状態が“実行中”である融資残高を合計する。\n 設問５            申込書類のチェックのルールと保証料の算出に用いる利率", "commentary_text": "問３\n 問 3 では，融資保証システムの再構築を題材に，新システムへの要望に基づいた情報システムに求められて\nいる機能の設計について出題した。全体として正答率は平均的であった。\n 設問 4(2)は，正答率が低かった。現行業務と融資保証の概要を踏まえた融資残高レポートに記載する内容を\n十分に理解できていないと思われる解答が散見された。現行業務と“契約状態”の示す状況を正しく理解した\n上で，支払う金額を導き出してほしい。\n 設問 5 は，正答率が低かった。新システムへの要望のうちの一つに対応している項目だけを解答し，他の要\n望を考慮していない受験者が多かった。全ての要望を正しく理解した上で，正答を導き出してほしい。", "question_file": "sources/2023r05h_sa_pm1_qs.pdf", "answer_file": "sources/2023r05h_sa_pm1_ans.pdf", "commentary_file": "sources/2023r05h_sa_pm1_cmnt.pdf"}, {"year": 2023, "section": "午後I", "question_no": 4, "topic": "ホテル向け顔認証システム・生体認証基盤・エッジコンピューティング", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問４\n                                    出題趣旨\n 生体情報の取得デバイスの発達や，AI を活用した認証技術の進化によって，生体認証だけで様々なサービス\nが享受できるシステムが実用化されてきている。システムアーキテクトは，基盤とアプリケーションとを分離\nし，将来に向けて汎用性・拡張性のあるシステム開発を行うとともに，エッジの処理能力を活用した負荷分散\n設計も考慮しなければならない。\n 本問では，ホテル事業者向けの顔認証システムを題材として，システムアーキテクトに求められる，要件分\n析から導かれる生体認証基盤の処理内容の理解力，生体認証基盤を事業者向けの個別システムに適用するため\nのシナリオの理解力，及び負荷分散のためのエッジコンピューティングを検討する能力を問う。\n\n\n     設問                          解答例・解答の要点                    備考\n設問１       (1)   a   会員管理システムに送信\n          (2) b チェックイン完了後のホテルの利用者\n設問２       (1) 公的証明書の顔写真と撮影した顔画像とで顔認証を行う。\n          (2) 受信した顔情報で認証を実施し，一致した顔情報に識別情報を関連付ける。\n          (3) 当該事業者の識別情報を特定するため\n設問３       (1) ① ・顔情報\n              ② ・識別情報\n                チェックインを予定しているホテルの利用者など，認証対象を絞り込める場\n          (2)\n                合\n          (3) 紛失などの場合に，利用者の個人情報を消去するため\n\n\n\n\n                                     2/2\n\n                                             ©2023   独立行政法人情報処理推進機構", "commentary_text": "問４\n 問４では，ホテルチェーンを展開する事業者向けの顔認証システム，及び顔認証を提供する基盤システムを\n題材に，要件分析を基にした顔認証基盤の構築，顔認証基盤の適用性検討から得られるエッジコンピューティ\nングの必要性と処理内容について出題した。全体として正答率は平均的であった。\n 設問 2(2)，(3)は，顔情報と識別情報の関連付けの方法，及び識別情報の使われ方について出題したが，正\n答率が低かった。特に(3)は，具体的な目的が記述できていない解答が散見された。識別情報の構築方法や運\n用方法を通して，顔認証基盤が様々な事業者への適用を可能にしていることを理解してほしい。\n 設問 3(2)は正答率が低かった。具体例のない解答や，具体例だけで，どのような場合に使用すべきかが不明\nな解答が散見された。エッジコンピューティングは，リアルタイム性の確保や負荷分散の目的で導入される\nが，一般にエッジコンピューティング用のデバイスは，ハードウェア制約から限られた情報しか内部に保持で\nきない場合が多い。本システムでは，チェックインを予定している利用者やチェックインを完了した利用者な\nど，認証対象を絞り込むことで，顔認証端末内部に保持する情報を限定し，エッジ認証を適用可能としている\nことを理解してほしい。\n\n\n\n\n                          1/1\n\n                                     ©2023   独立行政法人情報処理推進機構", "question_file": "sources/2023r05h_sa_pm1_qs.pdf", "answer_file": "sources/2023r05h_sa_pm1_ans.pdf", "commentary_file": "sources/2023r05h_sa_pm1_cmnt.pdf"}, {"year": 2023, "section": "午後II", "question_no": 1, "topic": "DX推進のための既存情報システム改善", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問１\n                           出題趣旨\n 近年，企業は競争優位の獲得や企業自身の存続のために，デジタルトランスフォーメーション（DX）を推進す\nることが増えている。しかし，DX の推進に必要な情報が整備されていないなどの課題が原因で，推進が困難に\nなる場合も多い。そのため，システムアーキテクトには，課題を解決して DX の推進を支援することが求められ\nており，その際には，既存の情報システムの改善が必要になることがある。\n 本問は，DX の推進のためのどのような課題をどのように解決したのか，その際に既存の情報システムをどの\nように改善したのか，及び改善に当たっての工夫について，その改善で課題が解決できると考えた理由を含め\nて具体的に論述することを求めている。論述を通じて，システムアーキテクトに必要な，DX 構想における情報\nシステムの改善計画の立案能力を評価する。", "commentary_text": "問１\n 問 1 では，デジタルトランスフォーメーション（DX）を具体的に表現できていた論述からは，実際に DX に関\nわった経験がうかがえた。一方で，業務の改革や改善を伴わない，現行業務の単純な IT 化・デジタル化を DX\nとしていた論述も散見された。論述されている DX の目的，目的の達成を阻害する情報システム上の課題，課\n題の解決手段としての改善内容，その際の工夫点について，それぞれの論理的整合が取れていないものもあっ\nた。DX の取組が増えてきている中，システムアーキテクトは，DX を現行業務のデジタル化ではなく，デジタ\nル技術による業務の改革や新しい業務・ビジネス・サービスの創造と捉え，情報システムの開発・改修に際し\nて，本来の目的や真の課題などを把握して，適切な提案や計画立案を行うことを心掛けてほしい。", "question_file": "sources/2023r05h_sa_pm2_qs.pdf", "answer_file": "sources/2023r05h_sa_pm2_ans.pdf", "commentary_file": "sources/2023r05h_sa_pm2_cmnt.pdf"}, {"year": 2023, "section": "午後II", "question_no": 2, "topic": "利用者と直接接点を持ちにくい情報システムのUI要件", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問２\n                           出題趣旨\n 近年，通販サイトやスマートフォンアプリケーションのように，開発者が利用者と直接の接点を持つことが\n難しい情報システムの開発が増えてきている。しかし，このような情報システムでは，システムアーキテクト\nが情報システムの要件を取りまとめる際に，ユーザーインタフェース（以下，UI という）の要件の検討におけ\nる課題が発生することが多い。\n 本問は，利用者と直接の接点を持つことが難しい情報システムの UI の要件の検討について，想定した利用者\n像，検討した UI，適切な UI を選択する際の課題とその対応策，UI を継続的に適切化していくための工夫など\nを具体的に論述することを求めている。論述を通じて，システムアーキテクトに必要な要件定義の能力を評価\nする。", "commentary_text": "問２\n 問 2 では，多くの論述が，利用者と直接の接点がない情報システムのユーザーインタフェースについて適切\nに解答しており，このような情報システムの開発が一般化していることをうかがわせた。一方で，自社内の情\n報システムのように，利用者と直接の接点がないとは言い難い情報システムに関する論述も散見された。この\nような論述は，本問で問うている内容とは異なることに留意してほしい。また，一般論に終始して具体性に欠\nける論述や，設問で求めている事項に触れていない論述も一部に見受けられた。システムアーキテクトとして\nの自らの経験や考えに基づいて，具体的に解答することを心掛けてほしい。", "question_file": "sources/2023r05h_sa_pm2_qs.pdf", "answer_file": "sources/2023r05h_sa_pm2_ans.pdf", "commentary_file": "sources/2023r05h_sa_pm2_cmnt.pdf"}, {"year": 2023, "section": "午後II", "question_no": 3, "topic": "組込みシステムの再利用容易化を考慮したアーキテクチャ", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問３\n                           出題趣旨\n 組込みシステムのシステムアーキテクトは，将来のソフトウェア・ハードウェアの変更に伴う改変に備え，\nシステム及び構成部品の再利用が容易になるアーキテクチャを構築することが求められる。\n 本問は，解答者が携わった組込みシステムのアーキテクチャ構築において，改変の対象となるシステムの再\n利用の容易化に対して，変更対象・範囲，改変の管理方法，及びテスト範囲についてどのような考慮をしたか，\n具体的に論述することを求めている。論述を通じて，組込みシステムのシステムアーキテクトに必要な，適切\nにアーキテクチャを構築するためのシステム理解力・アーキテクチャ構築力を評価する。\n\n\n\n\n                            1/1\n\n                                     ©2023   独立行政法人情報処理推進機構", "commentary_text": "問３\n 問 3 では，多くの論述で，対象の組込みシステムの特徴・制約を踏まえ，再利用の容易化を考慮した改変・\n設計について具体的に解答していた。開発プロセスの変更にも及ぶ広い視点からの論述もある一方で，一般論\nに終始している論述や，特定部分の実装にとどまっている論述も散見された。\n 組込みシステムのシステムアーキテクトは，将来を見据えたアーキテクチャ設計・改変を行う際には，関係\n者に内容を説明する機会も多いと思われる。システムの特徴・制約を把握し，必要な解決策を特定するととも\nに，適切な提案ができるよう心掛けてほしい。\n\n\n\n\n                          1/1\n\n                                     ©2023   独立行政法人情報処理推進機構", "question_file": "sources/2023r05h_sa_pm2_qs.pdf", "answer_file": "sources/2023r05h_sa_pm2_ans.pdf", "commentary_file": "sources/2023r05h_sa_pm2_cmnt.pdf"}, {"year": 2024, "section": "午後I", "question_no": 1, "topic": "企業合併に伴うシステム統合・再利用・業務プロセス/ファイル設計", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問１\n                                 出題趣旨\n 情報システムの構築において，システムアーキテクトは，既存システムの再利用や，他のシステムとの連\n携，及び社外の組織に関連する制約条件を正しく理解した上で，システムの設計を行う必要がある。\n 本問では，企業合併に伴うシステムの統合を題材として，要件を正しく理解した上で，システム化の方針や\nシステムの再利用範囲を立案し，業務プロセスの変更，関連する機能やファイル構造，及び連携する他システ\nムを含めて整合性のとれた情報システムの設計を行う能力を問う。\n\n\n 設問                         解答例・解答の要点                      備考\n設問１ (1) 製品を期日までに製造するために逆算して各工程の製造開始日時を決めるから\n      (2)   比例   所要時間×製造指示数\n            一定   所要時間\n設問２ (1) 製品と仕掛品は“無”\n                 ，原材料は“有”に設定する。\n    (2) ファイル① 製造\n            ファイル②   投入\n            要件   一つの製品を 1 日に複数回製造する場合があるという要件\n      (3) 発注書の様式を A 社で定めた様式に変更すること\n設問３ (1) 製造担当者が月末に記録表を参照し，まとめて生産管理システムに入力する作\n        業\n      (2) 前日までの実績を反映した管理指標値が参照可能になった。", "commentary_text": "問１\n 問 1 では，食品メーカーの合併に伴うシステムの統合を題材に，システム機能設計，ファイル設計，及び業\n務プロセスの変更点について出題した。全体として正答率は平均的であった。\n 設問 1(1)は正答率が低かった。製造指示及び投入指示を作成する際，充填，殺菌，調合，仕込の順番で作成\nしている理由を問う問題であったが，単純に問題文の一部を切り取っただけで，後工程から先に作成している\n理由が不明確な解答が多かった。\n 設問 2(1)は正答率がやや低かった。属性の値として“有” ，“無”がどのような場合に設定されるかを問う問\n題であったが，“有”，“無”の一方だけを記述した解答が散見された。システムの仕様を記述する際，何を書\nけば正しく伝わるかを意識してほしい。\n 設問 3(2)の正答率は平均的であった。B 社が問題としていた“本社管理部門で管理指標値が翌月にならない\nと確認できないこと”が，システム統合によって“夜間に管理指標値を集計し，翌日に本社から参照可能にな\nること”を答えてほしかったが，リアルタイムに反映されると誤解した解答が散見された。業務を正しく理解\nした上で情報システムを設計することの重要性を理解してほしい。", "question_file": "sources/2024r06h_sa_pm1_qs.pdf", "answer_file": "sources/2024r06h_sa_pm1_ans.pdf", "commentary_file": "sources/2024r06h_sa_pm1_cmnt.pdf"}, {"year": 2024, "section": "午後I", "question_no": 2, "topic": "会員向けサービスのシステム改善・機能設計", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問２\n                                 出題趣旨\n 情報システムを改善する際，システムアーキテクトは，業務の効率化や利便性を考慮し，改善要望をシステ\nム要件として設計する必要がある。\n 本問では，会員向けサービスに関わるシステム改善を題材として，現行業務を正しく理解・把握し，改善要\n望から情報システムに求められている機能を設計することについて，具体的な記述を求めている。要件を正し\nく理解し，求められている情報システムを設計する能力を問う。\n\n\n 設問                         解答例・解答の要点                      備考\n 設問１        次回の実約定日に振替先口座がある金融機関の口振結果営業日数を足す。\n 設問２        お知らせサービス，各種情報照会サービス，問合せサービス\n設問３ (1) ボーナス月の変更によってボーナス月が 1 年に 3 回以上とならないようにする\n        こと\n      (2) 住所変更の有無\n      (3) 条件① 電話番号ステータスが“無効”であること\n            条件② 収入証明書有効期限が 3 か月以内に到来すること\n設問４ (1) 勤務先変更理由が，転職，転籍又は退職の場合\n    (2) 契約ステータスが“解約予約”で借入残高が 0 円であること\n\n\n\n\n                                  1/2\n\n                                           ©2024   独立行政法人情報処理推進機構", "commentary_text": "問２\n 問 2 では，会員向けサービスに関わるシステム改善を題材に，情報システムへの改善要望から求められてい\nる機能の設計について出題した。全体として正答率は平均的であった。\n 設問 1 は，正答率が低かった。現在の基幹システムで借入残高を更新しているタイミングを十分に理解して\nいないと思われる解答が散見された。既存の情報システムの仕様を正しく理解した上で，機能を設計すること\nが重要であることを理解してほしい。\n 設問 4(1)は，正答率が低かった。事務部門の業務効率化を目的として，勤務先情報の変更時，基幹システム\nが審査システムと連携する条件を問う問題であったが，事務部門の現在の業務に関連しない解答が散見され\nた。どのような要望に基づいてシステムの改善を行うかを意識し，適切な処理内容を設計するよう心掛けてほ\nしい。", "question_file": "sources/2024r06h_sa_pm1_qs.pdf", "answer_file": "sources/2024r06h_sa_pm1_ans.pdf", "commentary_file": "sources/2024r06h_sa_pm1_cmnt.pdf"}, {"year": 2024, "section": "午後I", "question_no": 3, "topic": "複数拠点を持つ学習塾の通知システム・追加要望への設計変更", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問３\n                                   出題趣旨\n 情報システムの導入において，システムアーキテクトは，システム全体の構成や業務要件を踏まえた設計を\n行うことが求められる。複数の操作端末やサブシステムが連携することも一般的になっているが，このような\n場合は，連携する情報を正しく理解して設計することが必要になる。\n 本問では，複数拠点を持つ学習塾のシステムを題材として，要件を正しく理解して機能を設計する能力，既\n存機能への影響を考慮しながらレビュー指摘事項や追加要望に対応する能力を問う。\n\n\n     設問                       解答例・解答の要点                    備考\n 設問１         登校時と下校時で別の登下校用端末を使用した場合\n設問２ (1) 登下校通知メールに写真を添付する要望\n    (2) 保護者メールアドレスが同一の複数の生徒が，別々の拠点に所属している場合\n設問３ (1)       機能名    生徒情報管理\n             変更内容    全ての生徒の保護者メールアドレスを設定するように変更する。\n          (2) 登下校通知メールの送信が遅延する。\n          (3) ①   機能名   登下校通知メール送信\n                  変更内容 拠点名を登下校履歴ファイルの拠点コードから取得するように\n                       変更する。\n             ②    機能名   拠点在室人数表示\n                  変更内容 登下校日時が当日で，拠点コードが自拠点のものを抽出するよ\n                       うに変更する。\n\n\n\n\n                                     2/2\n\n                                           ©2024   独立行政法人情報処理推進機構", "commentary_text": "問３\n 問 3 では，学習塾の通知システムを題材に，複数の拠点がある場合の影響，追加要望に対応するための設計\nについて出題した。全体として正答率は平均的であった。\n 設問 2(2)は，正答率がやや低かった。保護者メールアドレスをキーに検索すると複数拠点の生徒が一致する\n場合があることを問う問題であったが，“臨時で別拠点の授業を受けている場合”と誤って解答した受験者が\n多かった。本文中の記述から処理の内容と指摘事項を読み取り，正答を導き出してほしい。\n 設問 3(1)は，正答率がやや低かった。変更する機能名を，“登下校通知メール送信”と誤って解答した受験\n者が多かった。追加機能の実装に併せて，既存機能にどのような変更が必要となるかを正しく把握してほし\nい。\n 設問 3(3)は，拠点在室人数表示機能に関する変更内容の正答率がやや低かった。“別拠点の生徒も抽出対象\nに加える”のような，条件の変更には触れているものの，内容が不十分な解答が散見された。別拠点の生徒が\n自拠点に登下校するケースだけでなく，自拠点の生徒が別拠点に登下校するケースもあることから，人数の計\n算には登下校履歴ファイルの“拠点コード”を使用する必要がある。追加要望に応じた変更を加える際の影響\n範囲を正しく把握し，適切な処理内容を設計できるよう心掛けてほしい。\n\n\n\n\n                            1/1\n\n                                     ©2024   独立行政法人情報処理推進機構", "question_file": "sources/2024r06h_sa_pm1_qs.pdf", "answer_file": "sources/2024r06h_sa_pm1_ans.pdf", "commentary_file": "sources/2024r06h_sa_pm1_cmnt.pdf"}, {"year": 2024, "section": "午後II", "question_no": 1, "topic": "先進技術を適用した業務の大幅な効率化・自動化", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問１\n                           出題趣旨\n 画像や話し言葉を理解する認識 AI，画像や文章などを作成する生成 AI，複数のシステムを連携させる RPA ツ\nールなどの先進技術を，クラウドサービスやソフトウェアパッケージなどで容易に利用できるようになってき\nた。それに伴い，認識と判断のデジタル化の難しさや費用対効果が著しく小さいなど，システム化が困難であ\nり，従来人手によってしか実現できないと考えていた業務の，大幅な効率化や自動化を実現することが可能に\nなった。システムアーキテクトは，先進技術を適用した情報システムの構築を推進する必要がある。\n 本問は，システム化計画の立案において，従来人手によってしか実現できないと考えていた理由，どのよう\nな先進技術をどのように適用して大幅な効率化や自動化を可能にしたのか，その適用の際に生じる様々な課題\nへの対処方法について具体的に論述することを求めている。論述を通じて，システムアーキテクトに必要なシ\nステム化計画の立案能力を評価する。", "commentary_text": "問１\n 問 1 では，先進技術の適用によって，従来人手によってしか実現できないと考えていた業務を，大幅に効率\n化したり，自動化を実現したりした経験についての論述を期待した。多くの受験者が設問に沿って論述できて\nいた。一方で，一部の受験者は，単なる作業を“入力業務”や“議事録作成業務”などとし，本来の業務目的\nを深く理解しないで論述していた。このような論述では，新技術の適用手順や方法，適用方針などが具体的に\n論述できていないものが多かった。例えば“銀行における振込依頼のための手書き依頼書の登録業務”など，\n業務目的を正しく理解して論述してほしい。また，実現した場合の効果である工数削減やコスト削減，信頼性\n向上などを述べるにとどまり，大幅な効率化や自動化が可能と考えた理由に触れていない論述も散見された。\n システムアーキテクトは，絶えず新技術を探求しつつ，業務の内容や目的を理解して適切に適用できるよう\nに心掛けてほしい。", "question_file": "sources/2024r06h_sa_pm2_qs.pdf", "answer_file": "sources/2024r06h_sa_pm2_ans.pdf", "commentary_file": "sources/2024r06h_sa_pm2_cmnt.pdf"}, {"year": 2024, "section": "午後II", "question_no": 2, "topic": "大量データを扱うバッチ処理の設計・再処理", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問２\n                           出題趣旨\n 企業などでは一定のリソースの下で大量データを効率的にバッチ処理することがある。バッチ処理では，大\n量データを処理すると処理時間が長い，オンライン処理との並行実施が必要，などの様々な課題が生じる。\n システムアーキテクトには，業務の特性や制約に基づいて課題を解決することが求められる。課題を解決す\nるためにはバッチ処理の設計を工夫することが必要である。また，エラーがあった場合に再処理できる仕組み\nを組み込んでおくことも求められる。\n 本問は，バッチ処理の設計について，具体的に論述することを求めている。論述を通じて，システムアーキ\nテクトに必要な業務内容を把握する能力，及び要求事項に対して効果的な技術を適用する能力などを評価する。\n\n\n\n\n                            1/1\n\n                                      ©2024   独立行政法人情報処理推進機構", "commentary_text": "問２\n 問 2 では，業務上の特性や制約に基づいて，バッチ処理の設計を工夫して課題を解決した経験についての論\n述を期待した。多くの受験者が実務で経験したことがうかがえる内容を論述できていた。一方で，“並行して\n実行処理しているバッチを重ならないようにした”といった運用で対処した論述や，“サーバを増設して複数\n台で並行処理した”といったハードウェアで課題を解決した論述など，設計の工夫とは言えないものも見受け\nられた。また，“優先度が高いものを取り込んだ”といった内容だけが述べられていて，業務と優先度の関係\nが具体的に述べられていないので，妥当性が判断できない論述も散見された。\n システムアーキテクトは，課題を適切に抽出し，業務上の特性や制約を踏まえた対応策を工夫することを心\n掛けてほしい。\n\n\n\n\n                           1/1\n\n                                   ©2024   独立行政法人情報処理推進機構", "question_file": "sources/2024r06h_sa_pm2_qs.pdf", "answer_file": "sources/2024r06h_sa_pm2_ans.pdf", "commentary_file": "sources/2024r06h_sa_pm2_cmnt.pdf"}, {"year": 2025, "section": "午後I", "question_no": 1, "topic": "消耗品の集中購買化・パッケージのフィット＆ギャップ・機能要件", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問１\n                             出題趣旨\n 近年，デジタルトランスフォーメーションの取組などにおいて，システムアーキテクトが業務改革とシステ\nムの導入に同時に取り組む機会が多くなっている。新しい業務モデルへの移行に当たっては，法令や社内の規\n則，諸事情による制約も多く，システムアーキテクトは，システムの導入に際して様々な制約を踏まえた設計\nを工夫しながら行う必要がある。\n 本問では，消耗品の集中購買化とそれに伴う業務システムの導入を題材として，ソフトウェアパッケージと\nのフィット＆ギャップの分析や運用上の制約などを考慮して必要な機能要件を整理する能力を問う。\n\n\n 設問                      解答例・解答の要点                        備考\n 設問１     機能名      データ集計機能\n         金額       当該事業者の前月の検収済商品の合計金額\n 設問２    ① 機能名 相見積取得及びスポット注文機能\n             理由   調達は，A 市規定類に基づく必要があるから\n        ② 機能名 商品単価変更機能\n          理由 単価は契約時に定められているから\n設問３ (1) 納入する施設\n    (2) A 市規定類に基づき，納入が年度内の契約期間内に完了される必要があるから\n      (3) 用途 契約上の発注予定数量の範囲内かどうかを管理する。\n             契約上の総額を超えない範囲で，物品ごとの発注予定数量を調整したい\n        状況\n             とき", "commentary_text": "問１\n 問 1 では，消耗品の集中購買化とそれに伴う業務システムの導入を題材に，フィット＆ギャップの分析と機\n能要件の整理について出題した。全体として正答率は平均的であった。\n 設問 1 は，機能名の正答率は高かったものの，金額の正答率は平均的であった。請求書の請求金額との一致\nを確認するために，どのような条件で金額を集計して確認するかを問う問題であったが，条件の一部が記載さ\nれていない解答が多かった。本文中の記述からデータ集計機能を利用した金額の集計方法をイメージして，正\n答を導き出してほしい。\n 設問 2 は，機能名の正答率は平均的であったものの，理由については正答率がやや低かった。業務上支障を\n来すと判断した機能を問う問題であったが，機能名は正答であるものの，当該機能を利用することが業務上な\nぜ問題となるのかを，本文中の記載から正しく理解できていない解答が散見された。\n 設問 3(2)は，正答率が低かった。A 市規定類の改正を行わないことによる運用上の制約を問う問題であった\nが，発注予定数量の調整や検収に関することを理由としている解答が散見された。本文中に記載されている A\n市規定類に基づく運用上の制約を正しく理解した上で，正答を導き出してほしい。", "question_file": "sources/2025r07h_sa_pm1_qs.pdf", "answer_file": "sources/2025r07h_sa_pm1_ans.pdf", "commentary_file": "sources/2025r07h_sa_pm1_cmnt.pdf"}, {"year": 2025, "section": "午後I", "question_no": 2, "topic": "営業支援システム新規構築・機能要件・データ移行要件", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問２\n                             出題趣旨\n 新システムの構築に当たり，システムアーキテクトは，現行業務・システムの課題を調査・ヒアリングし，\nシステムへの要求・要件を整理し，必要な機能を設計する必要がある。\n 本問では，営業活動を支援するシステムの新規構築を題材として，現行業務への課題及び要望を正しく理\n解，把握し，新システムの開発方針に従い，新システムの機能要件とデータ移行要件を定義することについ\nて，具体的な記述を求めている。要件を正しく理解し，求められている情報システムを設計する能力を問う。\n\n\n 設問                      解答例・解答の要点                        備考\n 設問１    失注，契約済，取消\n 設問２    時間帯 商談ツールに顧客情報を取り込んだ後の時間帯\n        理由    顧客管理システムからの顧客情報の取込みは 1 日に 1 回だから\n設問３ (1) 見積額，リスクレベル\n      (2) 所属組織と役職が人事システムにしかないから\n設問４ (1) 5 年以内に商談がなかった顧客\n      (2) 営業担当者が指定する名刺交換日が正しいとは限らないから\n      (3) 営業支援プラットフォームに名刺サービスとの連携機能が標準装備される予定\n          であること\n\n\n\n\n                              1/2\n\n                                          ©2025   独立行政法人情報処理推進機構", "commentary_text": "問２\n 問 2 では，営業活動を支援するシステムの新規構築を題材に，新システムの機能要件とデータ移行要件を定\n義することと，必要となる機能概要を整理することについて出題した。全体として正答率は平均的であった。\n 設問 1 は，正答率が低かった。営業活動の流れを正確に理解できていないと思われる解答が散見された。本\n文中に記載されている商談状況を丁寧に読み取って正答を導き出してほしい。\n 設問 3(2)は，正答率は平均的であった。複数のシステム・ツールが登場する問題にもかかわらず，どのシス\nテムのことを述べているのかを明確にしていない解答が散見された。要件を明確にするためにはどのような情\n報が必要となるかを意識して，正答を導き出してほしい。\n 設問 4(1)は，正答率がやや低かった。顧客の範囲を適切に限定できていない解答が散見された。実業務にお\nいては仕様の誤解につながりかねないので，解答に当たっては，必要十分な表現を心掛けてほしい。", "question_file": "sources/2025r07h_sa_pm1_qs.pdf", "answer_file": "sources/2025r07h_sa_pm1_ans.pdf", "commentary_file": "sources/2025r07h_sa_pm1_cmnt.pdf"}, {"year": 2025, "section": "午後I", "question_no": 3, "topic": "不動産売買仲介システム再構築・機能設計", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問３\n                             出題趣旨\n 情報システムの再構築に当たり，システムアーキテクトは，業務の効率化や利便性を考慮し，新システムへ\nの要望をシステム要件として設計する必要がある。\n 本問では，不動産売買仲介システムの再構築を題材として，現行業務を正しく把握し，新システムへの要望\nから情報システムに求められている機能を設計することについて，具体的な記述を求めている。要件を正しく\n理解し，求められている情報システムを設計する能力を問う。\n\n\n     設問                   解答例・解答の要点                      備考\n 設問１        物件の所在地と地域マスターの担当地域から該当する営業担当者を割り当て\n            る。\n 設問２        ① ・営業担当者が魅力的で効果的な物件情報の紹介文を検討すること\n            ② ・マネージャが物件情報の紹介文に K 社として不適切な記載がないかどう\n              かチェックすること\n設問３ (1) マネージャが売却許可の申請を承認した後\n          (2) 折衝履歴情報\n          (3) 当該契約の直近の営業活動報告書の提出日に契約別報告間隔を加えた日付と当\n              日との差\n設問４ (1) 物件ステータスの値が成約済，決済済，売却済の媒介契約数の合計\n          (2) 営業担当者ごとの媒介契約数と各物件の物件ステータスの値の推移\n\n\n\n\n                               2/2\n\n                                         ©2025   独立行政法人情報処理推進機構", "commentary_text": "問３\n 問 3 では，不動産売買仲介システムの再構築を題材に，新システムへの要望に基づいた情報システムに求め\nられている機能の設計について出題した。全体として正答率は平均的であった。\n 設問 1 は，正答率が低かった。現在の業務とシステムの概要を踏まえ，新システムでどのように営業担当者\nを割り当てるかを問うたにもかかわらず，現在の業務の内容を解答した受験者が多かった。現在の業務を正し\nく把握した上で，システムでどのように設計するかを考えて，正答を導き出してほしい。\n 設問 4(1)は，正答率がやや低かった。物件ステータスの値ではなく“売買契約が締結された状態”と成約の\n説明を誤って解答した受験者が多かった。本文中に記載されている物件ステータスの値の遷移を正しく理解し\nた上で，正答を導き出してほしい。\n\n\n\n\n                         1/1\n\n                                    ©2025   独立行政法人情報処理推進機構", "question_file": "sources/2025r07h_sa_pm1_qs.pdf", "answer_file": "sources/2025r07h_sa_pm1_ans.pdf", "commentary_file": "sources/2025r07h_sa_pm1_cmnt.pdf"}, {"year": 2025, "section": "午後II", "question_no": 1, "topic": "複数情報システムのデータを活用した指標の提供", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問１\n                         出題趣旨\n 近年，業務改善や収益向上などの業務目標達成のために，複数の情報システムのデータを収集して指標の提\n供を求められることが増えている。システムアーキテクトは，このような複数の情報システムのデータを収集\nする必要のある状況において，業務目標と求められる指標の関係を理解した上で，指標の算出に必要なデータ\nなどを分析し，データを収集し指標を提供する機能を設計する。\n 本問は，複数の情報システムのデータを収集する必要のある指標の提供について具体的に論述することを求\nめている。論述を通じて，システムアーキテクトに必要な，業務を理解する能力，情報システムを設計する能\n力，及び複数の情報システムからのデータ収集に関する経験を評価する。", "commentary_text": "問１\n 問 1 では，複数の情報システムのデータを活用した指標の提供に関する経験についての論述を期待した。金\n融，製造，小売，医療，農業など多くの分野の論述があり，このような指標が一般的になってきていることが\nうかがえた。一方，業務目標と指標の関係が不明確な論述や，指標と関連の薄い要件定義を記述している論述\nも散見された。システムアーキテクトは，業務目標を正しく理解し，指標を算出するために必要なデータを特\n定して必要な指標を提供できるように心掛けてほしい。", "question_file": "sources/2025r07h_sa_pm2_qs.pdf", "answer_file": "sources/2025r07h_sa_pm2_ans.pdf", "commentary_file": "sources/2025r07h_sa_pm2_cmnt.pdf"}, {"year": 2025, "section": "午後II", "question_no": 2, "topic": "現新システムの差異を踏まえたデータ移行", "topic_label_status": "working_label_not_official_title", "answer_or_purpose_text": "問２\n                         出題趣旨\n 情報システムの刷新や企業統合などに伴って新しくシステムを構築した場合，現行システムからの移行が必\n要になる。その際システムアーキテクトは，現行システムから新システムに取引先や仕訳などの重要なデータ\nを移行する方法を検討し，移行計画を立案する。移行方法を検討する際には，現行システムと新システム（以\n下，現新システムという）の仕様やデータ構造の差異を踏まえて，データマッピングやデータ変換ルールの策\n定などの具体的な対応方法を検討する。また，移行計画の立案では，作業時間や作業品質の観点を踏まえて適\n切な移行タイミングと実施方法を選択することが重要である。\n 本問は，現新システムの差異を踏まえたデータ移行について具体的に論述することを求めている。論述を通\nじて，システムアーキテクトに必要な，移行方法を検討した経験，移行計画を立案する能力などを評価する。\n\n\n\n\n                          1/1\n\n                                  ©2025   独立行政法人情報処理推進機構", "commentary_text": "問２\n 問 2 では，現行システムと新システム間の差異を踏まえたデータ移行についての論述を期待した。多くの受\n験者がデータの移行タイミングと実施方法を具体的に論述できており，実際に手順を検討した経験があること\nがうかがえた。一方，現行システムと新システム間の差異を明確にせず，実施した事項の記述にとどまってい\nる論述も散見された。システムアーキテクトは，移行データの仕様や特性に応じて，移行方法を適切に検討で\nきるように心掛けてほしい。\n\n\n\n\n                           1/1\n\n                                   ©2025   独立行政法人情報処理推進機構", "question_file": "sources/2025r07h_sa_pm2_qs.pdf", "answer_file": "sources/2025r07h_sa_pm2_ans.pdf", "commentary_file": "sources/2025r07h_sa_pm2_cmnt.pdf"}], "common": [{"year": 2023, "section": "午後II", "commentary_common": "全問に共通して，自らの経験に基づき設問に素直に答えている論述が多かったが，問題文に記載してあるプ\nロセスや観点などを抜き出し，一般論と組み合わせただけの表面的な論述も散見された。また，実施した事項\nを論述するだけにとどまり，実施した理由や検討の経緯が読み取れない論述も少なからず見受けられた。自ら\nが実際にシステムアーキテクトとして検討し取り組んだことを，設問に沿って具体的に論述してほしい。"}, {"year": 2024, "section": "午後II", "commentary_common": "全問に共通して，自らの経験に基づき設問に素直に答えている論述が多かった。一方で，問題文に記載して\nあるプロセスや観点などを抜き出して一般論と組み合わせただけの表面的な論述や，実施した事項を論述する\nだけにとどまり，実施した理由や検討の経緯が読み取れない論述も少なからず見受けられた。自らが実際にシ\nステムアーキテクトとして検討し取り組んだことを，設問に沿って具体的に論述してほしい。"}, {"year": 2025, "section": "午後II", "commentary_common": "全問に共通して，自らの経験に基づき設問に素直に答えている論述が多かった。一方で，実施した事項を論\n述するだけにとどまり，実施した理由や検討の経緯が読み取れない論述も少なからず見受けられた。自らが実\n際にシステムアーキテクトとして検討し取り組んだことを，設問に沿って具体的に論述してほしい。"}]};function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){let y=year.value,s=sec.value,k=kw.value.trim().toLowerCase();let a=D.entries.filter(x=>(!y||String(x.year)===y)&&(!s||x.section===s)&&(!k||(x.topic+' '+x.answer_or_purpose_text+' '+x.commentary_text).toLowerCase().includes(k)));app.innerHTML=`<p>${a.length}件</p>`+a.map(x=>`<div class="card"><div class="meta">${x.year} ${x.section} 問${x.question_no}</div><h2>${x.topic}</h2><div class="links"><a href="${x.question_file}">問題PDF</a><a href="${x.answer_file}">解答例/出題趣旨PDF</a><a href="${x.commentary_file}">採点講評PDF</a></div><details><summary>解答例・出題趣旨（テキスト）</summary><div class="txt">${esc(x.answer_or_purpose_text)}</div></details><details><summary>採点講評（テキスト）</summary><div class="txt">${esc(x.commentary_text)}</div></details></div>`).join('')}kw.addEventListener('keydown',e=>{if(e.key==='Enter')render()});render();</script></body></html>
