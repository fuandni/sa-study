name: Draft OCR for legacy AM1 PDFs
on:
  push:
    branches: [audit/legacy-am1-ocr-20261015]
    paths:
      - tools/prepare_legacy_am1_ocr.py
      - .github/workflows/draft_legacy_am1_ocr.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese OCR and PyMuPDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn
          python3 -m pip install --quiet 'pymupdf>=1.24,<2'
      - name: Extract PDF-page text without changing exam data
        run: python3 tools/prepare_legacy_am1_ocr.py
      - name: Save OCR drafts on this audit branch only
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source_ocr/2015_a1_unreviewed.txt source_ocr/2016_a1_unreviewed.txt source_ocr/2017_a1_unreviewed.txt source_ocr/legacy_a1_ocr_index.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add unreviewed OCR draft text for 2015–2017 AM1 PDFs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
