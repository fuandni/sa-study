name: Test six-domain focus practice
on:
  pull_request:
    paths:
      - 'focus/**'
      - 'tests/test_focus_questions.cjs'
      - 'tests/test_focus_applied.cjs'
      - 'tests/test_focus_compact.cjs'
      - 'tests/test_focus_choice_reasons.cjs'
      - '.github/workflows/focus-test.yml'
  push:
    branches: [main]
    paths:
      - 'focus/**'
      - 'tests/test_focus_questions.cjs'
      - 'tests/test_focus_applied.cjs'
      - 'tests/test_focus_compact.cjs'
      - '.github/workflows/focus-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26
      - name: Check syntax and question invariants
        run: |
          node --check focus/data/questions.js
          node --check focus/assets/focus.js
          node tests/test_focus_questions.cjs
          node --check focus/data/applied.js
          node tests/test_focus_applied.cjs
          node tests/test_focus_compact.cjs
          node --check focus/data/applied_extra.js
          node tests/test_focus_live_counts.cjs
          node tests/test_focus_home_migration.cjs
          node tests/test_focus_answer_audit.cjs
          node --check focus/data/choice_reasons.js
          node tests/test_focus_choice_reasons.cjs
          node --check focus/data/numeric.js
          node tests/test_focus_numeric.cjs
          node tests/test_focus_numeric_ui.cjs
          node --check focus/data/scenario_cases.js
          node tests/test_focus_scenario_cases.cjs
