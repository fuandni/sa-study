name: Deploy SA to OCI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate question data
        run: |
          python3 tools/build_data.py
          python3 tools/validate_data.py

      - name: Prepare SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: Upload release to OCI staging
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -eu
          ssh "$OCI_USER@$OCI_HOST" 'rm -rf ~/sa_release_new && mkdir -p ~/sa_release_new'
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            ./ "$OCI_USER@$OCI_HOST:~/sa_release_new/"

      - name: Deploy, backup, and health-check
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -eu
          ssh "$OCI_USER@$OCI_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          WEBROOT=/var/www/sa
          STAGING="$HOME/sa_release_new"
          PUBLIC_STAGING="$HOME/sa_public_new"
          BACKUPS="$HOME/sa_backups"
          TS="$(date +%Y%m%d-%H%M%S)"

          test -f "$STAGING/index.html"
          test -f "$STAGING/data/app_config.js"
          test -f "$STAGING/data/a1_questions.js"
          test -f "$STAGING/data/am2_questions.js"

          mkdir -p "$BACKUPS"
          rm -rf "$PUBLIC_STAGING"
          mkdir -p "$PUBLIC_STAGING/a1" "$PUBLIC_STAGING/am2"

          # Build the public release explicitly. Repository-only tooling and
          # maintenance files are not exposed under the web root.
          for f in index.html morning_distribution.html morning_status.html pm_reference.html source_index.html sync_settings.html; do
            cp "$STAGING/$f" "$PUBLIC_STAGING/$f"
          done
          cp -a "$STAGING/assets" "$PUBLIC_STAGING/"
          cp -a "$STAGING/data" "$PUBLIC_STAGING/"
          cp -a "$STAGING/sources" "$PUBLIC_STAGING/"
          cp -a "$STAGING/a1/assets" "$PUBLIC_STAGING/a1/"
          cp -a "$STAGING/am2/assets" "$PUBLIC_STAGING/am2/"

          if [ -d "$WEBROOT" ]; then
            sudo tar -C "$WEBROOT" -czf "$BACKUPS/sa-$TS.tar.gz" .
          fi

          sudo mkdir -p "$WEBROOT"
          sudo rsync -a --delete "$PUBLIC_STAGING/" "$WEBROOT/"
          sudo find "$WEBROOT" -type d -exec chmod 755 {} \;
          sudo find "$WEBROOT" -type f -exec chmod 644 {} \;

          # Maintenance scripts are kept outside the public web root.
          if [ -d "$STAGING/scripts" ]; then
            sudo mkdir -p /opt/sa-maintenance
            sudo rsync -a --delete "$STAGING/scripts/" /opt/sa-maintenance/
            sudo find /opt/sa-maintenance -type d -exec chmod 755 {} \;
            sudo find /opt/sa-maintenance -type f -exec chmod 755 {} \;
          fi

          # Sync backend source is deployed outside the public web root.
          if [ -d "$STAGING/server" ]; then
            sudo mkdir -p /opt/sa-sync
            sudo rsync -a --delete "$STAGING/server/" /opt/sa-sync/
            sudo find /opt/sa-sync -type d -exec chmod 755 {} \;
            sudo find /opt/sa-sync -type f -exec chmod 644 {} \;
            if sudo systemctl is-active --quiet sa-sync 2>/dev/null; then
              sudo systemctl restart sa-sync
              sleep 1
              curl -fsS http://127.0.0.1:8787/health >/dev/null
            fi
          fi
          if command -v restorecon >/dev/null 2>&1; then
            sudo restorecon -RF "$WEBROOT" || true
          fi

          # Keep only the newest 5 deployment backups.
          ls -1t "$BACKUPS"/sa-*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f

          # Nginx config + local HTTPS health check.
          sudo nginx -t
          curl -kfsS https://127.0.0.1/sa/ >/dev/null

          rm -rf "$STAGING" "$PUBLIC_STAGING"
          echo "Deploy OK: $TS"
          REMOTE
