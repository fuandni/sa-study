の定石やノウハウを集めたものである。", "イ": "再利用性や柔軟性の高いプログラムを設計するために、参考となるオブジェクトの組合せ方をパターンとして分類したものであり、代表的なパターン集としてGoFパターンがある。", "ウ": "ソフトウェアの開発方法をパターン集としてまとめたものであり、組織編成や開発管理のためのパターンがある。", "エ": "ソフトウェアの基本構造を設計するためのパターンであり、その一つとしてMVCパターンがある。"}, "answer": "イ", "topic": "デザインパターン", "category": "設計・実装", "source_page": 6, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q07", "year": 2023, "section": "午前II", "question_no": 7, "question_text": "ある通信販売事業者は、AI技術を利用して人間のように受け答えする、Webのチャットをインタフェースとしたユーザーサポートシステムを開発している。テスト工程では、次の方法でテストする手法を採用した。このような、AIに関するテスト手法を何というか。<br><br>【テストの方法】<br>・判定者は、このシステムと人間との、それぞれを相手に自然言語によるチャットを行う。このとき、判定者はどちらがこのシステムで、どちらが人間なのかは知らされていない。<br>・判定者が一連のチャットを行った後に、チャットの相手のどちらがこのシステムで、どちらが人間かを判別できるかどうかを確認する。", "choices": {"ア": "実験計画法", "イ": "チューリングテスト", "ウ": "ファジング", "エ": "ロードテスト"}, "answer": "イ", "topic": "AIのチューリングテスト", "category": "テスト・品質", "source_page": 6, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q08", "year": 2023, "section": "午前II", "question_no": 8, "question_text": "JIS X 25010:2013（システム及びソフトウェア製品の品質要求及び評価（SQuaRE）―システム及びソフトウェア品質モデル）で定義されたシステム及び／又はソフトウェア製品の品質特性に関する説明のうち、適切なものはどれか。", "choices": {"ア": "機能適合性とは、明示された状況下で使用するとき、明示的ニーズ及び暗黙のニーズを満足させる機能を、製品又はシステムが提供する度合いのことである。", "イ": "信頼性とは、明記された状態（条件）で使用する資源の量に関係する性能の度合いのことである。", "ウ": "性能効率性とは、明示された利用状況において、有効性、効率性及び満足性をもって明示された目標を達成するために、明示された利用者が製品又はシステムを利用することができる度合いのことである。", "エ": "保守性とは、明示された時間帯で、明示された条件下に、システム、製品又は構成要素が明示された機能を実行する度合いのことである。"}, "answer": "ア", "topic": "SQuaRE品質特性", "category": "テスト・品質", "source_page": 7, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q09", "year": 2023, "section": "午前II", "question_no": 9, "question_text": "UML 2.0のステートマシン図の記法に適合している図はどれか。", "choices": {"ア": "", "イ": "", "ウ": "", "エ": ""}, "answer": "ア", "topic": "UMLステートマシン図", "category": "設計・実装", "source_page": 8, "asset_path": "assets/2023_q09_uml.png", "asset_type": "diagram", "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAApQAAANcCAIAAABuYagGAAEAAElEQVR4nOx9Z3wUVfv2me19N5ue0EOo0qtI79IfQJSiFAWkqCBiQRQQLFhoUkQERASU3jtYUIoU6b0mIWVTtvedmffD9d/zjpsQOyQ41wd+YXd25syZM+fu183wPE9EiBAhQoQIEaUHkgc9ABEiRIgQIULEn4MovEWIECFChIhSBlF4ixAhQoQIEaUMovAWIUKECBEiShlE4S1ChAgRIkSUMojCW4QIESJEiChlEIW3CBEiRIgQUcogCm8RIkSIECGilEEU3iJEiBAhQkQpgyi8RYgQIUKEiFIGUXiLECFChAgRpQyi8BYhQoQIESJKGUThLUKECBEiRJQyiMJbhAgRIkSIKGUQhbcIESJEiBBRyiAKbxEiRIgQIaKUQRTeIkSIECFCRCmDKLxFiBAhQoSIUgZReIsQIUKECBGlDKLwFiFChAgRIkoZROEtQoQIESJElDKIwluECBEiRIgoZRCFtwgRIkSIEFHKIApvESJEiBAhopRBFN4iRIgQIUJEKYMovEWIECFChIhSBlF4ixAhQoQIEaUMovAWIUKECBEiShlE4S1ChAgRIkSUMojCW4QIESJEiChlEIW3CBEiRIgQUcogCm8RIkSIECGilEEU3iJEiBAhQkQpgyi8RYgQIUKEiFIGUXiLECFChAgRpQyi8BYhQoQIESJKGWR/6uhgMCiVSiUSic/nUyqVbrdbJpM5HA6NRkMIwVc4xu/363Q6qVTKMAzP8wzD/DvjFyFChAgRIv5z+HPCm+d5iURy/vz5vn373rlzR6lUejweQkh0dHR8fDzP816vV6vV3rlzx2QyzZ49u1u3blKp9N8ZuQgRIkSIEPEfxZ8T3hKJJBQKPfLIIz///LNUKlWr1T6fT6VS+f1+/Ovz+WJjY/v27bthwwaj0cgwDMuyHMfJ5fJ/6QZEiBAhQoSI/xr+XMyb53lCCMdxZrNZp9MplUq1Wn3y5MmXXnrp4sWLSqUyNjZ2//79p06d2rp1a/369YPBIMuyouQWIUKECBEi/kH8OeEtl8tlMlkwGAwEAlKpNBQK8Tx/586dL7/88tq1azzPL168+KWXXnrrrbe6d++u1+uVSqVCoeA47l8avQgRIkSIEPEfxJ9zmwNKpZIQwrKsTCaTSqU+n08ikZjN5rFjx27btq1nz559+vQhhNAkNYlEzGkXIUKECBEi/jH8FeENQDYHg0GXy6VQKMqVK5eYmPjcc8+9+OKLLMv+cyMUIUKECBEiRPwGf114I3kNyecSiaR8+fJTp04tKCjQ6XQKheIfHKIIESJEiBAhQoi/7tDmOE4mk4VCocOHDzdq1Egul7MsGxMTo1Kp8vPz/8EhihAhQoQIESKE+HPCOxQKIfuM4zibzUYIOXz4sNVqfeaZZwghUqmUZdlgMBgTE/MvDFWECBEiRIgQQcifFd7BYDAYDLrdbp7n5XL5tGnTunXrNmPGjGHDhjEMI5FIpFKpXC4X+dREiBAhQoSIfw9/LuatUCikUinP8x6Pp3r16gqFYtCgQU888QQhhGVZkUxNhAgRIkSIuA/4c8IbTGqo827WrFlqa 1, "question_text": "JIS X 0160:2021（ソフトウェアライフサイクルプロセス）によれば、ソフトウェアライフサイクルプロセスにおいて、提供するソフトウェアシステムが利害関係者要件（要求事項）に合致し、利用に適していることを、顧客とともに確信するに至るためのテストを何と呼ぶか。", "choices": {"ア": "ソフトウェア受入れテスト", "イ": "ソフトウェア検証", "ウ": "ソフトウェア適格性確認テスト", "エ": "ファズテスト"}, "answer": "ア", "topic": "ソフトウェア受入れテスト", "category": "要求・開発プロセス", "source_page": 9, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q12", "year": 2023, "section": "午前II", "question_no": 12, "question_text": "スクラムを適用したアジャイル開発において、スクラムチームで、人、関係、プロセス及びツールの観点から、何がうまくいき、何がうまくいかなかったのかを議論し、プロセス改善を促進するアクティビティはどれか。", "choices": {"ア": "スプリントレトロスペクティブ", "イ": "スプリントレビュー", "ウ": "デイリースクラム", "エ": "バックログリファインメント"}, "answer": "ア", "topic": "スクラムのレトロスペクティブ", "category": "マネジメント・契約", "source_page": 9, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q13", "year": 2023, "section": "午前II", "question_no": 13, "question_text": "製品Xと製品Yを販売している企業が、見積作成と提案書作成に掛かる業務時間を、それぞれ20%削減できるシステムの構築を検討している。Activity-Based Costingを用いて、次の条件が洗い出された。本システム構築による製品Xの見積作成と製品Xの提案書作成に関する月間総人件費削減効果は幾らか。<br><br>【条件】<br>・製品Xの見積作成に掛かる月間業務時間は、50時間<br>・製品Xの提案書作成に掛かる月間業務時間は、50時間<br>・製品Yの見積作成に掛かる月間業務時間は、100時間<br>・製品Yの提案書作成に掛かる月間業務時間は、400時間<br>・製品Xと製品Yの見積作成に掛かる月間総人件費は、60万円<br>・製品Xと製品Yの提案書作成に掛かる月間総人件費は、360万円<br>・見積作成と提案書作成は、それぞれ人件費単価が異なる部門が担っている<br>・製品Xと製品Yの見積作成に掛かる人件費単価は、同じである<br>・製品Xと製品Yの提案書作成に掛かる人件費単価は、同じである", "choices": {"ア": "4万円", "イ": "8万円", "ウ": "12万円", "エ": "14万円"}, "answer": "ウ", "topic": "ABCによる人件費削減効果", "category": "マネジメント・契約", "source_page": 10, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q14", "year": 2023, "section": "午前II", "question_no": 14, "question_text": "WTO政府調達協定の説明はどれか。", "choices": {"ア": "EU市場で扱われる電気・電子製品、医療機器などにおいて、一定基準値を超える特定有害物質（鉛、カドミウム、六価クロム、水銀など6物質）の使用を規制することを定めたものである。", "イ": "国などの公的機関が率先して、環境物品等（環境負荷低減に資する製品やサービス）の調達を推進し、環境物品等への需要の転換を促進するために必要な事項を定めたものである。", "ウ": "政府機関などによる物品・サービスの調達において、締約国に対する市場開放を進めて国際的な競争の機会を増大させるとともに、苦情申立て、協議及び紛争解決に関する実効的な手続を定めたものである。", "エ": "締約国に対して、工業所有権の保護に関するパリ条約や、著作権の保護に関するベルヌ条約などの主要条項を遵守することを義務付けるとともに、知的財産権保護のための最恵国待遇などを定めたものである。"}, "answer": "ウ", "topic": "WTO政府調達協定", "category": "マネジメント・契約", "source_page": 11, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q15", "year": 2023, "section": "午前II", "question_no": 15, "question_text": "システム開発における発注者と受注者であるベンダーとの契約方法のうち、実費償還契約はどれか。", "choices": {"ア": "委託業務の進行中に発生するリスクはベンダーが負い、発注者は注文時に合意した価格を支払う。", "イ": "インフレ率や特定の製品の調達コストの変化に応じて、あらかじめ取り決められた契約金額を調整する。", "ウ": "契約時に、目標とするコスト、利益、利益配分率、上限額を合意し、目標とするコストと実際に発生したコストの差異に基づいて利益を配分する。", "エ": "ベンダーの役務や技術に対する報酬に加え、委託業務の遂行に要した費用の全てをベンダーに支払う。"}, "answer": "エ", "topic": "実費償還契約", "category": "マネジメント・契約", "source_page": 11, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q16", "year": 2023, "section": "午前II", "question_no": 16, "question_text": "パーソナルデータを用いた、個人をスコアリングするサービスの事例はどれか。", "choices": {"ア": "口コミサイトなど、個人が提供する情報をコンテンツとするWebサイトの内容を解析することによって、そのサイトの信用度を格付けするサービス", "イ": "個人情報を取り扱う情報システムに対して、ペネトレーションテストなど、種々の検証を実施し、セキュリティの確保の状態を評価するサービス", "ウ": "対象者の許諾の下で収集・提供されたデータをAIが分析することによって、個人への融資条件の決定などに使用される指標を提供するサービス", "エ": "ベンチャー企業の創業者の経営能力や経歴を様々な角度から数値化することによって、その企業の成長の可能性を投資家向けに予測するサービス"}, "answer": "ウ", "topic": "パーソナルデータを用いたスコアリング", "category": "AI・データ活用", "source_page": 12, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q17", "year": 2023, "section": "午前II", "question_no": 17, "question_text": "暗号技術のうち、共通鍵暗号方式のものはどれか。", "choices": {"ア": "AES", "イ": "ElGamal暗号", "ウ": "RSA", "エ": "楕円曲線暗号"}, "answer": "ア", "topic": "共通鍵暗号", "category": "セキュリティ", "source_page": 12, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q18", "year": 2023, "section": "午前II", "question_no": 18, "question_text": "TPM 2.0で定義されている機能はどれか。", "choices": {"ア": "TLS通信におけるデータの暗号化及び復号を行う機能", "イ": "サーバでの認証回数をシードと掛け合わせてワンタイムパスワードを生成する機能", "ウ": "シードと呼ばれる値と、その値が作られた時刻からの経過時間から、ワンタイムパスワードを生成する機能", "エ": "モジュール内で暗号化のための鍵を生成し、安全に保管する機能"}, "answer": "エ", "topic": "TPM 2.0", "category": "セキュリティ", "source_page": 12, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q19", "year": 2023, "section": "午前II", "question_no": 19, "question_text": "迷惑メールの検知手法であるベイジアンフィルターの説明はどれか。", "choices": {"ア": "信頼できるメール送信元を許可リストに登録しておき、許可リストにないメール送信元からの電子メールは迷惑メールと判定する。", "イ": "電子メールが正規のメールサーバから送信されていることを検証し、迷惑メールであるかどうかを判定する。", "ウ": "電子メールの第三者中継を許可しているメールサーバを登録したデータベースの掲載情報を基に、迷惑メールであるかどうかを判定する。", "エ": "利用者が振り分けた迷惑メールと正規のメールから特徴を学習し、迷惑メールであるかどうかを統計的に判定する。"}, "answer": "エ", "topic": "ベイジアンフィルター", "category": "セキュリティ", "source_page": 13, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q20", "year": 2023, "section": "午前II", "question_no": 20, "question_text": "送信者Aは、署名生成鍵Xを使って文書ファイルのデジタル署名を生成した。送信者Aから、文書ファイルとその文書ファイルのデジタル署名を受信者Bが受信したとき、受信者Bができることはどれか。ここで、受信者Bは署名生成鍵Xと対をなす、署名検証鍵Yを保有しており、受信者Bと第三者は署名生成鍵Xを知らないものとする。", "choices": {"ア": "文書ファイルが改ざんされた場合、デジタル署名、文書ファイル及び署名検証鍵Yの整合性を確認することによって、その改ざん部分を判別できる。", "イ": "文書ファイルが改ざんされていないこと、及びデジタル署名が署名生成鍵Xによって生成されたことを確認できる。", "ウ": "文書ファイルがマルウェアに感染していないことを認証局に問い合わせて確認できる。", "エ": "文書ファイルとデジタル署名のどちらかが改ざんされた場合、どちらが改ざんされたかを判別できる。"}, "answer": "イ", "topic": "デジタル署名", "category": "セキュリティ", "source_page": 13, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q21", "year": 2023, "section": "午前II", "question_no": 21, "question_text": "CPU内部の命令読取り用バスとデータアクセス用バスとを分離するハーバードアーキテクチャを用いる目的として、適切なものはどれか。", "choices": {"ア": "CPU以外のバスマスターを使用可能にする。", "イ": "バスの信号線の本数を減らす。", "ウ": "プログラムの実行時間を短縮する。", "エ": "メモリの内容を保護する。"}, "answer": "ウ", "topic": "命令・データ用バス分離", "category": "コンピュータ・DB・ネットワーク", "source_page": 14, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q22", "year": 2023, "section": "午前II", "question_no": 22, "question_text": "WebブラウザやHTTPを用いず、独自のGUIとデータ転送機構を用いた、ネットワーク対戦型のゲームを作成する。仕様の(2)の実現に用いることができる仕組みはどれか。<br><br>【仕様】<br>(1) ゲームは囲碁や将棋のように2人のプレーヤの間で行われ、ゲームの状態はサーバで管理する。プレーヤはそれぞれクライアントプログラムを操作してゲームに参加する。<br>(2) プレーヤが新たな手を打ったとき、クライアントプログラムはサーバにある関数を呼び出す。サーバにある関数は、その手がルールに従っているかどうかを調べて、ルールに従った手であればゲームの状態を変化させ、そうでなければその手が無効であることをクライアントプログラムに知らせる。<br>(3) ゲームの状態に変化があれば、サーバは各クライアントプログラムにその旨を知らせることによってGUIに反映させる。", "choices": {"ア": "CGI", "イ": "PHP", "ウ": "RPC", "エ": "XML"}, "answer": "ウ", "topic": "RPC", "category": "コンピュータ・DB・ネットワーク", "source_page": 14, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q23", "year": 2023, "section": "午前II", "question_no": 23, "question_text": "クラウドサービスに関係するデータのうち、クラウドサービス派生データに関する記述はどれか。", "choices": {"ア": "あるクラウドサービスから別のクラウドサービスへ移行するときに、データの再入力が不要で、移行先でも活用されるデータ", "イ": "クラウドサービスの提供者の管理下にあり、データセンター全体の構成や、ストレージのリソース配分などのクラウドサービスの維持に使用するデータ", "ウ": "利用者がクラウドサービスの公開インタフェースを使って入力したデータやサービスを実行して作成したデータ", "エ": "利用者がクラウドサービスを利用した時間や作業内容などが記録されたログデータ"}, "answer": "エ", "topic": "クラウドサービス派生データ", "category": "コンピュータ・DB・ネットワーク", "source_page": 15, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q24", "year": 2023, "section": "午前II", "question_no": 24, "question_text": "DBMSがトランザクションのコミット処理を完了するタイミングはどれか。", "choices": {"ア": "アプリケーションプログラムの更新命令完了時点", "イ": "チェックポイント処理完了時点", "ウ": "ログバッファへのコミット情報書込み完了時点", "エ": "ログファイルへのコミット情報書込み完了時点"}, "answer": "エ", "topic": "DBMSのコミット", "category": "コンピュータ・DB・ネットワーク", "source_page": 15, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2023-AM2-Q25", "year": 2023, "section": "午前II", "question_no": 25, "question_text": "CSMA/CD方式のLANで使用されるスイッチングハブ（レイヤー2スイッチ）は、フレームの蓄積機能、速度変換機能や交換機能をもっている。このようなスイッチングハブと同等の機能をもち、同じプロトコル階層で動作する装置はどれか。", "choices": {"ア": "ゲートウェイ", "イ": "ブリッジ", "ウ": "リピータ", "エ": "ルータ"}, "answer": "イ", "topic": "レイヤ2スイッチ/ブリッジ", "category": "コンピュータ・DB・ネットワーク", "source_page": 15, "asset_path": null, "asset_type": null, "source_file": "2023r05h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q01", "year": 2024, "section": "午前II", "question_no": 1, "question_text": "アジャイル開発プロセスにおいて、Bill Wakeが提案した“INVEST”と呼ばれる六つの観点を用いて行うことはどれか。", "choices": {"ア": "効率よくアクティビティ図を作成する。", "イ": "コード化できるレベルまで詳細化されたデータフロー図を作成する。", "ウ": "再利用しやすいソフトウェアパターンとなっているかどうかを評価する。", "エ": "質の高いユーザーストーリーとなっているかどうかを評価する。"}, "answer": "エ", "topic": "INVESTとユーザーストーリ", "category": "設計・実装", "source_page": 3, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q02", "year": 2024, "section": "午前II", "question_no": 2, "question_text": "組込みシステムでDBMSを用いるときには、通信のオーバーヘッド、通信負荷の発生を防ぐこと、必要なメモリ容量をリソース制限内に抑えることなどを目的として、インプロセスデータベースを用いることがある。このインプロセスデータベースの説明として、適切なものはどれか。", "choices": {"ア": "クライアントサーバ形式のクライアントとなるアプリケーションプログラムとソケットを介して通信し、SQLを用いて処理を記述する。", "イ": "データベースエンジンはライブラリ形式で提供され、アプリケーションプログラムとリンクされて同一メモリ空間で動作する。", "ウ": "テーブルデータの全体をメモリ上に配置して、データベース処理を高速化する。", "エ": "一つのテーブルを一つのファイルで管理し、アプリケーションプログラムからはファイル入出力のAPIで操作する。"}, "answer": "イ", "topic": "インプロセスデータベース", "category": "設計・実装", "source_page": 3, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q03", "year": 2024, "section": "午前II", "question_no": 3, "question_text": "マイクロサービスアーキテクチャを採用してアプリケーションソフトウェアを設計している。障害発生による影響の範囲を局所化してシステム全体への波及を抑えるために、マイクロサービスへリクエストを送ったときのエラーが、あらかじめ設定している回数を超える場合に、障害が解消するまでは、リクエストを送らない方式とする。この方式を何と呼ぶか。", "choices": {"ア": "CORS", "イ": "RPC", "ウ": "サーキットブレーカー", "エ": "サービスディスカバリー"}, "answer": "ウ", "topic": "サーキットブレーカー", "category": "設計・実装", "source_page": 4, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q04", "year": 2024, "section": "午前II", "question_no": 4, "question_text": "オブジェクト指向におけるデザインパターンに関する記述として、適切なものはどれか。", "choices": {"ア": "幾つかのクラスに共通する性質を抽出して、一般化したクラスを定義したものである。", "イ": "同じ性質をもつオブジェクト群を、更にクラスとして抽象化したものである。", "ウ": "オブジェクトの内部にデータを隠蔽し、オブジェクトの仕様と実装とを分離したものである。", "エ": "システムの構造や機能について、設計上の典型的な問題とその解決策とを示し、再利用できるようにしたものである。"}, "answer": "エ", "topic": "デザインパターン", "category": "設計・実装", "source_page": 4, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q05", "year": 2024, "section": "午前II", "question_no": 5, "question_text": "モジュール間のデータの受渡し方法のうち、最も低いモジュール結合度となるものはどれか。", "choices": {"ア": "単一のデータ項目を大域的データで受け渡す。", "イ": "単一のデータ項目を引数で受け渡す。", "ウ": "データ構造を大域的データで受け渡す。", "エ": フサイクルのどの段階でも適用できることが意図されている。", "エ": "プロトタイプの廃棄には、廃棄プロセスは適用されない。"}, "answer": "ウ", "topic": "JIS X 0160 廃棄プロセス", "category": "マネジメント・契約", "source_page": 8, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q12", "year": 2024, "section": "午前II", "question_no": 12, "question_text": "リーンソフトウェア開発の説明として、適切なものはどれか。", "choices": {"ア": "経験的プロセス制御の理論を基本としており、スプリントと呼ばれる周期で“検査と適応”を繰り返しながら開発を進める。", "イ": "製造業の現場から生まれた考え方をソフトウェア開発に適用したものであり、“ムダをなくす”、“品質を作り込む”といった七つの原則を重視して、具体的な開発プロセスやプラクティスを策定する。", "ウ": "比較的小規模な開発に適した、プログラミングに焦点を当てた開発アプローチであり、“コミュニケーション”などの五つの価値を定義し、それらを高めるように具体的な開発プロセスやプラクティスを策定する。", "エ": "利用者から見て価値があるまとまりを一つの機能単位とし、その単位ごとに、設計や構築などの五つのプロセスを繰り返しながら開発を進める。"}, "answer": "イ", "topic": "リーンソフトウェア開発", "category": "マネジメント・契約", "source_page": 8, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q13", "year": 2024, "section": "午前II", "question_no": 13, "question_text": "スタンフォード大学ハッソ・プラットナー・デザイン研究所によるデザイン思考の説明はどれか。", "choices": {"ア": "与えられた問題に対して一つの正しい解決策を見つけるために、アイディア出しの段階で、テーマに制限を設けてアイディアが発散しないようにする手法", "イ": "本質的な問題がどこにあるのかを絞り込むために、利用者との対話よりも、過去のデータや経験を分析することを重視する手法", "ウ": "利用者の立場から問題解決に取り組む方法論であり、現場を観察することによって利用者を理解し、共感することから始め、問題定義、アイディア出し、試作、試行を繰り返す手法", "エ": "類似の問題が発生した場合に、迅速に解決策を探り当てるために、過去の問題とその解決策をナレッジデータベースとして蓄積する手法"}, "answer": "ウ", "topic": "デザイン思考", "category": "要求・開発プロセス", "source_page": 9, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q14", "year": 2024, "section": "午前II", "question_no": 14, "question_text": "WTO政府調達協定に関する記述として、適切なものはどれか。", "choices": {"ア": "WTO政府調達協定加盟各国に平等になるように、政府調達協定の定める発注金額の基準額は、各国で同一金額となっている。", "イ": "WTO政府調達協定の目的は、政府調達における国際的な競争の機会を増大させるとともに、政府調達をめぐる締約国間の問題につき円滑な解決を図ることである。", "ウ": "WTO政府調達協定は、各国の中央政府が発注する案件に適用され、特殊法人など政府関係機関が発注する案件には適用されない。", "エ": "政府公共調達データベースでは、WTO政府調達協定の適用を受ける案件の検索はできないので、政府調達案件を知るためには、官報を入手する必要がある。"}, "answer": "イ", "topic": "WTO政府調達協定", "category": "マネジメント・契約", "source_page": 9, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q15", "year": 2024, "section": "午前II", "question_no": 15, "question_text": "組込みシステム開発において、製品に搭載するLSIを新規に開発する。LSI設計を自社で行い、LSI製造を外部に委託する場合の委託先として、適切なものはどれか。", "choices": {"ア": "IPプロバイダ", "イ": "デザインハウス", "ウ": "ファウンドリー", "エ": "ファブレスメーカー"}, "answer": "ウ", "topic": "LSI製造委託先", "category": "マネジメント・契約", "source_page": 10, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q16", "year": 2024, "section": "午前II", "question_no": 16, "question_text": "eシールの説明はどれか。", "choices": {"ア": "インターネット上のゲーム内に限定されたキャラクターのイメージデータの作成者を証明する仕組みの一つである。", "イ": "個人の意思表示や、意思表示をしている個人の本人確認が必要な電子文書データについて、その電子文書データの作成者の証明と改ざん防止のために、個人が行う電子署名である。", "ウ": "電子文書データの作成者の証明と改ざん防止のために、重要文書を扱う国や地方自治体などの公共機関だけに使用が許されている電子署名である。", "エ": "法人が作成した電子文書データについて、その電子文書データの作成者が間違いなくその法人であり、かつ、その電子文書データは作成後に改ざんされていないことを証明する仕組みである。"}, "answer": "エ", "topic": "eシール", "category": "設計・実装", "source_page": 10, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q17", "year": 2024, "section": "午前II", "question_no": 17, "question_text": "デジタル署名のあるソフトウェアをインストールするときに、そのソフトウェアの発行元を確認するために使用する証明書はどれか。", "choices": {"ア": "EV SSL証明書", "イ": "クライアント証明書", "ウ": "コードサイニング証明書", "エ": "サーバ証明書"}, "answer": "ウ", "topic": "コードサイニング証明書", "category": "設計・実装", "source_page": 10, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q18", "year": 2024, "section": "午前II", "question_no": 18, "question_text": "NISTが制定した、AESにおける鍵長の条件はどれか。", "choices": {"ア": "128ビット、192ビット、256ビットから選択する。", "イ": "256ビット未満で任意に指定する。", "ウ": "暗号化処理単位のブロック長よりも32ビット長くする。", "エ": "暗号化処理単位のブロック長よりも32ビット短くする。"}, "answer": "ア", "topic": "AES鍵長", "category": "セキュリティ", "source_page": 11, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q19", "year": 2024, "section": "午前II", "question_no": 19, "question_text": "デジタル証明書が失効しているかどうかをオンラインで確認するためのプロトコルはどれか。", "choices": {"ア": "CHAP", "イ": "LDAP", "ウ": "OCSP", "エ": "SNMP"}, "answer": "ウ", "topic": "OCSP", "category": "セキュリティ", "source_page": 11, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q20", "year": 2024, "section": "午前II", "question_no": 20, "question_text": "日本のITセキュリティ評価及び認証制度（JISEC）に関する記述のうち、適切なものはどれか。", "choices": {"ア": "IT製品のうち、利用者ガイダンス、管理者ガイダンスを除いた部分だけが評価用提供物件である。", "イ": "ハードウェア、ファームウェア、システムは制度の対象外であり、ソフトウェアだけが対象である。", "ウ": "ファイアウォールのように、セキュリティ機能に特化したIT製品だけが制度の対象である。", "エ": "保護するべき資産、対抗すべき脅威、適用すべき環境が具体化できるIT製品だけが制度の対象である。"}, "answer": "エ", "topic": "JISEC", "category": "セキュリティ", "source_page": 11, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q21", "year": 2024, "section": "午前II", "question_no": 21, "question_text": "プロセッサの高速化を図る手法であるスーパースカラの説明として、適切なものはどれか。", "choices": {"ア": "互いに依存関係のない複数の命令を動的に並列実行する。", "イ": "同時に実行可能な複数の機能が埋め込まれた語長の長い命令を実行する。", "ウ": "パイプラインのステージを細分化する。", "エ": "一つの命令で同時に複数のデータの処理を行う。"}, "answer": "ア", "topic": "スーパースカラ", "category": "コンピュータ・DB・ネットワーク", "source_page": 12, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q22", "year": 2024, "section": "午前II", "question_no": 22, "question_text": "ストレージ仮想化技術のシンプロビジョニングに関する記述として、適切なものはどれか。", "choices": {"ア": "アプリケーションに対して、物理ストレージの容量を実際よりも大きく見せかけること", "イ": "サーバのOSが利用するボリュームとして、複数のストレージにまたがる大きな容量のボリュームを作成しておくこと", "ウ": "複数の利用者が仮想化されたストレージを共有しているときに、利用者ごとに利用できる容量の上限を定めて割り当てておくこと", "エ": "利用者には意識させることなく、利用者間で重複しているデータを削除することによって、ストレージの使用効率を高めること"}, "answer": "ア", "topic": "ストレージのシンプロビジョニング", "category": "コンピュータ・DB・ネットワーク", "source_page": 12, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q23", "year": 2024, "section": "午前II", "question_no": 23, "question_text": "システムに異常が起きた際の対応方法の一つであるフェールソフトとして、適切な動作はどれか。", "choices": {"ア": "警告を出し、処理続行の判断をオペレーターに任せる。", "イ": "システムのサービスを順次、安全に停止する。", "ウ": "性能が低下しても、処理を継続する。", "エ": "データや装置を損なうことなく運転を停止する。"}, "answer": "ウ", "topic": "フェールソフト", "category": "コンピュータ・DB・ネットワーク", "source_page": 12, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q24", "year": 2024, "section": "午前II", "question_no": 24, "question_text": "DBMSにおいて、デッドロックを検出するために使われるデータ構造はどれか。", "choices": {"ア": "資源割当表", "イ": "時刻印順管理表", "ウ": "トランザクションの優先順管理表", "エ": "待ちグラフ"}, "answer": "エ", "topic": "デッドロック検出", "category": "コンピュータ・DB・ネットワーク", "source_page": 13, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2024-AM2-Q25", "year": 2024, "section": "午前II", "question_no": 25, "question_text": "HTTP応答のステータスコードで、指定されたURLにはコンテンツがなく、別のURLへアクセスし直すようにWebブラウザに促す（リダイレクトさせる）ことを意味するコードはどれか。ここで、左側の3桁の数字がステータスコードで、右側の語句はHTTP応答のステータス行にステータスコードとともに示される説明メッセージである。", "choices": {"ア": "204 No Content", "イ": "302 Found", "ウ": "404 Not Found", "エ": "501 Not Implemented"}, "answer": "イ", "topic": "HTTP 302リダイレクト", "category": "コンピュータ・DB・ネットワーク", "source_page": 13, "asset_path": null, "asset_type": null, "source_file": "2024r06h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q01", "year": 2025, "section": "午前II", "question_no": 1, "question_text": "DFDで用いられる図形要素だけの組みはどれか。", "choices": {"ア": "円弧、実体、データストア", "イ": "円弧、データストア、データフロー", "ウ": "源泉と吸収、実体、プロセス", "エ": "源泉と吸収、データフロー、プロセス"}, "answer": "エ", "topic": "DFDの構成要素", "category": "設計・実装", "source_page": 3, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q02", "year": 2025, "section": "午前II", "question_no": 2, "question_text": "オブジェクト指向設計における設計原則の説明のうち、開放・閉鎖原則のものはどれか。", "choices": {"ア": "クラスにもたせる役割は一つだけにするべきであり、複数の役割が存在する場合にはクラスを分割する。", "イ": "クラスを利用するクライアントごとに異なるメソッドが必要な場合は、インタフェースを分ける。", "ウ": "上位のモジュールは、下位のモジュールに依存してはならない。", "エ": "モジュールは、機能の追加や変更が可能であって、その影響を他のモジュールに及ぼしてはならない。"}, "answer": "エ", "topic": "オブジェクト指向設計原則", "category": "設計・実装", "source_page": 3, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q03", "year": 2025, "section": "午前II", "question_no": 3, "question_text": "A社は、各種のサービスを複数のWebサイトで提供している。現在、利用者は、Webサイトにログインするたびに、そのサイト用の利用者IDとパスワードを入力する必要がある。この煩わしさを解消するために、いずれかのWebサイトで一度ログインすれば、全てのWebサイトを利用できる仕組みとしたい。この仕組みを実現するための機能を有するOSSはどれか。", "choices": {"ア": "BIND", "イ": "Keycloak", "ウ": "Logstash", "エ": "OpenSSL"}, "answer": "イ", "topic": "シングルサインオン（Keycloak）", "category": "セキュリティ", "source_page": 3, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q04", "year": 2025, "section": "午前II", "question_no": 4, "question_text": "大量のデータを並列に処理するために、入力データから中間キーと値との組みを生成する処理と、同じ中間キーをもつ値を加工する処理との2段階で実行するプログラミングモデルはどれか。", "choices": {"ア": "2相コミット", "イ": "KVS", "ウ": "MapReduce", "エ": "マルチスレッド"}, "answer": "ウ", "topic": "MapReduce", "category": "設計・実装", "source_page": 4, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q05", "year": 2025, "section": "午前II", "question_no": 5, "question_text": "デザインパターンの一つであるObserverパターンを利用して実現できることはどれか。", "choices": {"ア": "あるオブジェクトの状態が変化したときに、それに依存する全てのオブジェクトに自動的に通知する。", "イ": "ある機能をもつオブジェクトを新しいオブジェクトでラップし、機能を動的に拡張する。", "ウ": "あるクラスのインスタンスが一つしか存在しないことを保証する。", "エ": "配列や集合のような実装の異なるコンテナに対し、同一のインタフェースでアクセスする。"}, "answer": "ア", "topic": "Observerパターン", "category": "設計・実装", "source_page": 4, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q06", "year": 2025, "section": "午前II", "question_no": 6, "question_text": "プログラム中にエラーが存在するかどうかなどを、ソースプログラムを分析することによって調べるテストツールはどれか。", "choices": {"ア": "静的解析ツール", "イ": "テストカバレッジ分析ツール", "ウ": "テストベッド", "エ": "メトリクス計測ツール"}, "answer": "ア", "topic": "静的解析ツール", "category": "テスト・品質", "source_page": 4, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q07", "year": 2025, "section": "午前II", "question_no": 7, "question_text": "プログラムPをテストケースの集合であるテストセットTでテストし、テスト結果が全て想定結果と一致することを確認した。そのテストセットTに不具合を検出できる十分な能力があるかどうかを評価するために、次の手順でテストを行った。このテストを何と呼ぶか。<br><small>① Pのステートメントの1か所に、例えば(a+b)&gt;1を(a+b&gt;1)のようにするというような、軽微な変更を行ったプログラムP₁,P₂,…,Pₙを作成する。この個々のプログラムの変更内容は全て異なっている。<br>② テストセットTを用いて全てのプログラムP₁,P₂,…,Pₙをテストする。<br>③ PᵢからPₙまでのm個のプログラムのうち、プログラムPと "イ": "開発を反復するので、リスクが高い部分に対して初期段階で対処しやすく、プロジェクト全体のリスクを減らすことができる。", "ウ": "基本となるアーキテクチャをプロジェクトの初期に決定するので、コンポーネントを再利用しやすくなる。", "エ": "ひとまとまりの要件を1単位として設計からテストまで実施するので、要件ごとに開発状況が把握できる。"}, "answer": "エ", "topic": "ユースケース駆動開発", "category": "要求・開発プロセス", "source_page": 7, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q12", "year": 2025, "section": "午前II", "question_no": 12, "question_text": "要求分析におけるインタビュー技法である構造化インタビューの長所と短所はどれか。", "choices": {"ア": "回答者に自由に質問することによって深い洞察を得られるが、準備をうまくしなければヒアリングした内容を聞きそびれてしまうことがある。", "イ": "回答に基づいて知りたいことを深く掘り下げられるが、インタビューの技量によって成果が左右されることがある。", "ウ": "状況に応じて臨機応変に質問を変更できるが、複数人にインタビューする場合にヒアリング内容にずれが生じることがある。", "エ": "複数の回答者からの結果を比較しやすいが、インタビューの際に特定の回答者の回答から深い洞察を引き出すことが困難である。"}, "answer": "エ", "topic": "構造化インタビュー", "category": "要求・開発プロセス", "source_page": 8, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q13", "year": 2025, "section": "午前II", "question_no": 13, "question_text": "要件定義において、システムが提供する機能単位と利用者又は外部システムとの間の相互作用や、システム内部と外部との境界を明示するために使用される図はどれか。", "choices": {"ア": "アクティビティ図", "イ": "オブジェクト図", "ウ": "クラス図", "エ": "ユースケース図"}, "answer": "エ", "topic": "コンテキスト図", "category": "要求・開発プロセス", "source_page": 8, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q14", "year": 2025, "section": "午前II", "question_no": 14, "question_text": "ラボ契約の特徴はどれか。", "choices": {"ア": "依頼員がベンダー企業側の作業担当者を指名して直接指揮命令を行う契約であり、ベンダー企業はこれを前提に要員を割り当てる。", "イ": "依頼元は、契約に基づきスキルや人数などの基準を満たすように要員を確保することをベンダー企業に求める代わりに、一定以上の発注を約束する。", "ウ": "開発したシステムによって依頼元が将来獲得する売上や利益に応じた報酬をベンダー企業にも分配することを条件に、開発時のベンダー企業への発注金額を抑える。", "エ": "ベンダー企業は、契約で定めた最低発注工数を下回って作業を完了した場合、実稼働工数に基づく金額の支払を依頼元に請求しなければならない。"}, "answer": "イ", "topic": "準委任契約", "category": "マネジメント・契約", "source_page": 8, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q15", "year": 2025, "section": "午前II", "question_no": 15, "question_text": "協調フィルタリングを用いた、商品のレコメンデーションの例はどれか。", "choices": {"ア": "多くの顧客の購買行動の類似性を相関分析などによって求め、顧客Aに類似した顧客Bが購入している商品を顧客Aに勧める。", "イ": "カテゴリ別に売れ筋商品のランキングを自動抽出し、リアルタイムで売れ筋情報を発信する。", "ウ": "顧客情報から、年齢、性別などの人口動態変数を用い、“20代男性”、“30代女性”などにセグメント化した上で、各セグメント向けの商品を提示する。", "エ": "野球のバットを購入した人に野球のボールを勧めるなど、商品間の関連に着目して関連商品を提示する。"}, "answer": "ア", "topic": "協調フィルタリング", "category": "AI・データ活用", "source_page": 9, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q16", "year": 2025, "section": "午前II", "question_no": 16, "question_text": "ウォータリングホール（水飲み場型）攻撃はどれか。", "choices": {"ア": "ICMPパケットの送信元を偽装し、多数の宛先に送ることによって、攻撃対象のコンピュータに大量の偽のICMPパケットの応答を送る。", "イ": "PC内のhostsファイルにある、ドメインとIPアドレスとの対応付けを大量に書き換え、偽のWebサイトに誘導し、大量のコンテンツをダウンロードさせる。", "ウ": "送信元IPアドレスを偽装したDNS問合せを多数のDNSサーバに送ることによって、攻撃対象のコンピュータに大量の応答を送る。", "エ": "誰でも管理ツールの送信ができるメールサーバを踏み台にして、電子メールの送信元アドレスを詐称したなりすましメールを大量に送信する。"}, "answer": "ウ", "topic": "水飲み場型攻撃", "category": "セキュリティ", "source_page": 9, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q17", "year": 2025, "section": "午前II", "question_no": 17, "question_text": "ある企業でのリスク分析結果は次のとおりであった。情報漏えい対策のうち、事象Cが年間発生確率を最も低くなるものはどれか。ここで、対策前の事象Xの年間発生確率をQ₀とし、事象Xへの対策によって事象Xの発生を防止できる確率をdₓとするとき、事象Xへの対策による事象Cの年間発生確率Pは、Q₀(1−dₓ)で計算する。<br><small>対策前のマルウェア感染（事象A）の年間発生確率：40%<br>対策前の外部ネットワークからの侵入（事象B）の年間発生確率：10%<br>情報漏えい（事象C）は、マルウェア感染又は外部ネットワークからの侵入の発生によって発生する。</small>", "choices": {"ア": "dₐ=40%のマルウェア対策ソフトとdᵦ=60%のIPSを導入する。", "イ": "dₐ=50%のマルウェア対策ソフトとdᵦ=50%のIPSを導入する。", "ウ": "dₐ=75%のマルウェア対策ソフトを導入する。", "エ": "dᵦ=75%のIPSを導入する。"}, "answer": "ウ", "topic": "リスク分析と対策効果", "category": "設計・実装", "source_page": 10, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q18", "year": 2025, "section": "午前II", "question_no": 18, "question_text": "通信の暗号化や利用者の認証の機能をもち、遠隔にあるコンピュータに安全にログインするためのプロトコルはどれか。", "choices": {"ア": "L2TP", "イ": "LDAP", "ウ": "RADIUS", "エ": "SSH"}, "answer": "エ", "topic": "RADIUS", "category": "セキュリティ", "source_page": 10, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q19", "year": 2025, "section": "午前II", "question_no": 19, "question_text": "スパムメール対策として、サブミッションポート（ポート番号587）を導入する目的はどれか。", "choices": {"ア": "DNSサーバにSPFレコードを問い合わせる。", "イ": "DNSサーバに登録されている公開鍵を使用して、デジタル署名を検証する。", "ウ": "POP before SMTPを使用して、メール送信者を認証する。", "エ": "SMTP-AUTHを使用して、メール送信者を認証する。"}, "answer": "エ", "topic": "サブミッションポート（587）", "category": "セキュリティ", "source_page": 11, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q20", "year": 2025, "section": "午前II", "question_no": 20, "question_text": "キャッシュメモリにおけるセットアソシアティブ方式の説明として、適切なものはどれか。", "choices": {"ア": "CPUがあるアドレスにアクセスすると、そのアドレスがキャッシュメモリに存在するかどうか、キャッシュメモリ内の全てのタグを検索する。", "イ": "主記憶のアドレスとキャッシュメモリのアドレスを対応付けて、キャッシュメモリと主記憶の両方にデータを書き込む。", "ウ": "主記憶のある一つのメモリブロックを、キャッシュメモリ内の単一又は複数の配置可能なロケーションに対応付ける。", "エ": "プログラムが仮想アドレスにアクセスすると、対応する物理アドレスのメモリがアクセスされる。"}, "answer": "ウ", "topic": "セットアソシアティブ方式", "category": "設計・実装", "source_page": 11, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q21", "year": 2025, "section": "午前II", "question_no": 21, "question_text": "コンテナ型仮想化におけるオーケストレーションの説明として、適切なものはどれか。", "choices": {"ア": "アプリケーションとその実行環境をまとめ、一つのOSで動作させることによって、システム資源のオーバーヘッドが少なくなり、高速に起動できる。", "イ": "ある物理サーバで動作している仮想サーバを、その仮想サーバで稼働しているソフトウェアは実行状態のまま、別の物理サーバに移動させる。", "ウ": "処理の順序やサービスの呼出しを制御するプログラムは存在せず、あらかじめ設定した動作条件に従って自律的に動作できる。", "エ": "処理の順序を制御するプログラムからのリクエストによってサービスを実行し、実行結果をレスポンスとして制御するプログラムに返して処理を継続する。"}, "answer": "エ", "topic": "コンテナ型仮想化とオーケストレーション", "category": "コンピュータ・DB・ネットワーク", "source_page": 12, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q22", "year": 2025, "section": "午前II", "question_no": 22, "question_text": "キャッシュサーバを利用した検索処理の平均応答時間は、キャッシュサーバでヒットした場合には0.2秒、ヒットしない場合には2.2秒である。現在の平均検索応答時間は1.0秒である。3年後のキャッシュサーバのヒット率は、検索量の増加によって現状の半分になると予測されている。3年後の平均検索応答時間は何秒か。ここで、その他のオーバーヘッドは考慮しない。", "choices": {"ア": "1.1", "イ": "1.3", "ウ": "1.6", "エ": "1.9"}, "answer": "ウ", "topic": "キャッシュヒット率と平均応答時間", "category": "コンピュータ・DB・ネットワーク", "source_page": 12, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q23", "year": 2025, "section": "午前II", "question_no": 23, "question_text": "コードの値からデータの対象物が連想できるコード体系はどれか。", "choices": {"ア": "シーケンスコード", "イ": "デシマルコード", "ウ": "ニモニックコード", "エ": "ブロックコード"}, "answer": "ウ", "topic": "コード体系と順序性", "category": "設計・実装", "source_page": 12, "asset_path": null, "asset_type": null, "source_file": "2025r07h_sa_am2_qs.pdf", "audit_status": "source_transcribed_and_answer_checked", "asset_data": null}, {"id": "SA-2025-AM2-Q24", "year": 2025, "section": "午前II", "question_no": 24, "question_text": "トランザクションの隔離性水準を高めたとき、不整合なデータを読み込むトランザクション数と、単位時間に処理できるトランザクション数との適切な組合せはどれか。", "choices": {"ア": "増える／増える", "イ": "増える／減る", "ウ": "減る／増える", "エ": "減る／減る"}, "answer": "エ", "topic": "トランザクション分離性水準", "category": "コンピュータ function H(q){try{return JSON.parse(localStorage.getItem(histKey(q))||'{"tries":0,"correct":0,"wrong":0,"last":null}')}catch(e){return {tries:0,correct:0,wrong:0,last:null}}}
function cats(){return [...new Set(Q.map(q=>q.category))].sort()} $('cat').innerHTML+='<option>'+cats().join('</option><option>')+'</option>';
function updateSummary(){const hs=Q.map(q=>H(q)),tried=hs.filter(h=>h.tries>0).length,tries=hs.reduce((a,h)=>a+h.tries,0),cor=hs.reduce((a,h)=>a+h.correct,0);$('summary').textContent=`回答経験 ${tried}/75問　累積 ${cor}/${tries}${tries?' ('+Math.round(cor/tries*100)+'%)':''}`}
function filtered(){let y=$('year').value,c=$('cat').value,m=$('mode').value;let a=Q.filter(q=>(!y||String(q.year)===y)&&(!c||q.category===c));if(m==='wrong')a=a.filter(q=>H(q).wrong>0);if(m==='unanswered')a=a.filter(q=>H(q).tries===0);if(m==='weak')a=a.filter(q=>{let h=H(q);return h.tries>0&&h.correct/h.tries<=.60});return a}
function start(){S=filtered();if($('order').value==='random')S.sort(()=>Math.random()-.5);else S.sort((a,b)=>a.year-b.year||a.question_no-b.question_no);i=0;render()}
function render(){updateSummary();if(!S.length){$('app').innerHTML='<div class="card">条件に該当する問題がありません。</div>';return}if(i>=S.length){$('app').innerHTML='<div class="card"><b>この演習は終了。</b><br><button onclick="showStats()">成績を見る</button></div>';return}let q=S[i],h=H(q);let choices=letters.map(k=>`<button class="choice" onclick="ans('${k}')"><b>${k}</b>${q.choices[k]?'　'+q.choices[k]:''}</button>`).join('');$('app').innerHTML=`<div class="card"><div class="nav"><button onclick="prev()">← 前</button><span>${i+1}/${S.length}</span><button onclick="next()">次 →</button></div><div class="meta"><span class="pill">${q.year}</span><span class="pill">問${q.question_no}</span><span class="pill">${q.category}</span> ${q.topic} / 原本p.${q.source_page}</div><div class="qtext">${q.question_text}</div>${q.asset_data?`<img class="asset" src="${q.asset_data}" alt="${q.asset_type||'図表'}">`:''}<div>${choices}</div><div class="meta">履歴 ${h.tries}回 / 正解${h.correct} / 誤答${h.wrong}</div><div id="result"></div></div>`}
function ans(c){let q=S[i],h=H(q),ok=c===q.answer;h.tries++;ok?h.correct++:h.wrong++;h.last={answer:c,correct:ok,at:new Date().toISOString()};localStorage.setItem(histKey(q),JSON.stringify(h));document.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('result').innerHTML=`<div class="result ${ok?'ok':''}">${ok?'正解':'不正解'}　あなた: ${c} / 正解: ${q.answer}<br><button onclick="next()">次へ</button></div>`;updateSummary()}
function next(){if(i<S.length-1){i++;render()}else{i++;render()}} function prev(){if(i>0){i--;render()}}
function home(){S=[];$('app').innerHTML=`<div class="card"><h2>ホーム</h2><p>年度・カテゴリ・出題条件を選んで「演習開始」。誤答だけ、未回答だけ、正答率60%以下だけにも絞れます。</p><p><button onclick="exportHist()">履歴を書き出す</button> <button onclick="importHist()">履歴を読み込む</button> <button onclick="resetHist()">履歴を全消去</button></p></div>`;updateSummary()}
function showStats(){let groups=[['年度',q=>String(q.year)],['カテゴリ',q=>q.category]];let html='<div class="card"><h2>成績</h2>';for(const [title,key] of groups){let m={};for(const q of Q){let k=key(q),h=H(q);if(!m[k])m[k]=[0,0,0];m[k][0]+=h.correct;m[k][1]+=h.tries;if(h.tries)m[k][2]++}html+=`<h3>${title}別</h3><table class="stats"><tr><th>${title}</th><th>回答経験</th><th>累積</th><th>正答率</th></tr>`+Object.entries(m).map(([k,v])=>`<tr><td>${k}</td><td>${v[2]}</td><td>${v[0]}/${v[1]}</td><td>${v[1]?Math.round(v[0]/v[1]*100)+'%':'-'}</td></tr>`).join('')+'</table>'}html+='<p><button onclick="home()">ホームへ</button></p></div>';$('app').innerHTML=html;updateSummary()}
function exportHist(){let o={version:1,exportedAt:new Date().toISOString(),history:{}};for(const q of Q){let h=localStorage.getItem(histKey(q));if(h)o.history[q.id]=JSON.parse(h)}let blob=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sa75_history.json';a.click();URL.revokeObjectURL(a.href)}
function importHist(){let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);for(const [id,h] of Object.entries(o.history||{}))localStorage.setItem('sa75_'+id,JSON.stringify(h));home()}catch(e){alert('履歴ファイルを読み込めませんでした')}};r.readAsText(inp.files[0])};inp.click()}
function resetHist(){if(confirm('75問の回答履歴を全て削除しますか？')){for(const q of Q)localStorage.removeItem(histKey(q));home()}}
document.addEventListener('keydown',e=>{if(['1','2','3','4'].includes(e.key)&&S.length&&i<S.length){let btn=document.querySelectorAll('.choice')[Number(e.key)-1];if(btn&&!btn.disabled)btn.click()}else if(e.key==='ArrowRight'&&S.length)next();else if(e.key==='ArrowLeft'&&S.length)prev()});home();
</script></body></html>
