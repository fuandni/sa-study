<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SA UML集中演習</title>
<style>
:root{font-family:system-ui,"Noto Sans JP","Yu Gothic",sans-serif;color:#18243b;background:#f4f7fc}
*{box-sizing:border-box}body{margin:0}header{background:#142744;color:white;padding:.8rem max(1rem,calc((100vw - 1100px)/2));display:flex;gap:.65rem;flex-wrap:wrap}header a{color:#eaf3ff;text-decoration:none;padding:.4rem .55rem}header a:hover{background:#36537e;border-radius:6px}
main{max-width:1070px;margin:auto;padding:1.2rem}.card,.hero{background:#fff;border:1px solid #dbe4f0;border-radius:14px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 3px 12px #172b4d0b}.hero{background:linear-gradient(125deg,#fff,#eaf3ff)}h1{margin:0 0 .45rem;font-size:1.8rem}h2{font-size:1.3rem}h3{font-size:1.1rem}.muted{color:#546985}.statistics,.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem;margin:1rem 0}.stat,.tile{border:1px solid #dbe4f0;border-radius:10px;background:#fff;padding:1rem}.stat strong{display:block;font-size:1.5rem}.tile{text-align:left;cursor:pointer;color:inherit}.tile b{display:block;margin-bottom:.5rem}.tile small{color:#526783}.tile:hover{border-color:#2573cc;background:#f7fbff}
button,select{font:inherit;border:1px solid #a9b7c9;background:white;color:#17263a;padding:.7rem .9rem;border-radius:9px;cursor:pointer}button:hover{border-color:#2573cc;background:#f3f8ff}button:disabled{cursor:not-allowed;opacity:.5}.primary{background:#1658a4;color:white;border-color:#1658a4}.primary:hover{background:#0b478b}.fields{display:flex;flex-wrap:wrap;gap:.75rem;align-items:end}.fields label{display:grid;gap:.25rem}.controls{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.65rem;margin-top:1rem}.diagram{margin:1rem auto;border:1px solid #d3dce9;border-radius:10px;background:#fff;overflow:auto}.diagram svg{width:100%;min-width:430px;height:auto;display:block}.diagram figcaption{font-size:.8rem;color:#596c85;text-align:center;margin:0 0 .5rem}.stem{font-size:1.1rem;line-height:1.8;white-space:pre-wrap}.answers{display:grid;gap:.6rem}.answers button{text-align:left;display:flex;align-items:flex-start;gap:.7rem;line-height:1.55;min-height:3rem}.answers button kbd{display:inline-block;min-width:1.8rem;text-align:center;border-radius:5px;padding:.08rem .25rem;background:#e6eefb;color:#1b4e8a}.option-content{display:flex;flex:1;min-width:0;flex-direction:column;align-items:stretch;gap:.3rem}
.choice-figure{display:block;max-width:550px;width:100%;border:1px solid #dbe4f0;border-radius:7px;background:white;padding:.3rem}
.choice-figure svg{display:block;width:100%;height:auto}
.answers button.correct{background:#e9f8ee;border:2px solid #218257}.answers button.wrong{background:#fff0ed;border:2px solid #ba423c}.feedback{border-left:4px solid #1658a4;background:#f4f8ff;padding:1rem;margin-top:1rem;line-height:1.7}.feedback.correct{border-color:#218257;background:#eef9f2}.feedback.wrong{border-color:#ba423c;background:#fff5f4}.feedback p{margin:.5rem 0}.feedback .diagram{margin-top:.8rem}.pbar{height:8px;border-radius:9px;background:#e3e9f2;overflow:hidden;margin:.65rem 0}.pbar div{height:100%;background:#3179bf}.result-row{padding:.6rem 0;border-bottom:1px solid #e3e9f2}.question-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem}.pill{font-size:.8rem;border-radius:100px;padding:.25rem .7rem;background:#eaf2ff;color:#1658a4}.note{font-size:.88rem;color:#536783}.empty{padding:1rem;background:#fff;border-radius:10px}
@media(max-width:620px){main{padding:.6rem}.hero,.card{padding:.85rem}h1{font-size:1.4rem}.diagram svg{min-width:480px}.diagram{overflow-x:auto}.fields label{flex:1 1 100%}.fields select{width:100%}.answers button{padding:.75rem}.controls button{flex:1}}
</style></head><body>

</body></html>
